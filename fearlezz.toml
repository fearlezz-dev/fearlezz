# Fearlezz proves its own changes with built in pieces: devenv gives every check the
# toolchain, rust brings fmt, clippy and tests, safety scans for leaked credentials. Each check
# runs in a clean env inside `devenv shell`: only the base variables and the ones listed under
# `env` reach it.

use = ["devenv", "rust", "agents", "safety"]

# Prose needs no proof: an edit to it alone reruns no check.
no_proof = ["*.md", "docs/**", "LICENSE-*", ".gitignore", "demo/notes/**"]

# Checks without inputs are keyed on every file outside no_proof. The tests keep inputs, as a
# speed hint: an edit to a workflow or install.sh would otherwise rerun the slowest check. They
# read the embedded agent skill and pieces, the fixtures, the proof workflow and README.md,
# which no_proof leaves out of the default key. They leave out ee/, which has checks of its own.
[check.tests]
inputs = ["crates/**/*.rs", "Cargo.toml", "crates/**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "skills/fearlezz/SKILL.md", "crates/fearlezz/presets/**", "crates/fearlezz/tests/fixtures/**", "README.md", ".github/workflows/proof.yml"]

# The proof host in ee/ is a Cargo workspace of its own, built to wasm, so the rust piece's
# checks at the root do not reach it. These read ee/ and the proof bundle crate it shares with
# the core, so other core edits never rerun them.
[check.ee-fmt]
run = "cargo fmt --manifest-path ee/Cargo.toml --all --check"
stage = "working"
inputs = ["ee/**", "crates/fearlezz-proof/**"]

[check.ee-clippy]
run = "cargo clippy --manifest-path ee/Cargo.toml --all-targets --quiet --message-format=json"
stage = "working"
findings = { read = "cargo", lints = ["clippy", "rustc"] }
inputs = ["ee/**", "crates/fearlezz-proof/**"]

# Builds the worker and drives it under wrangler dev against a fake GitHub.
[check.ee-tests]
run = "cargo test --manifest-path ee/Cargo.toml --quiet"
stage = "working"
tests = { count = 'test result: \w+\. (\d+) passed; (\d+) failed' }
test_files = ["ee/host-tests/tests/**"]
inputs = ["ee/**", "crates/fearlezz-proof/**"]

[check.actionlint]
run = "actionlint"
stage = "working"

# action.yml is metadata, not a workflow, so it is parsed here instead.
[check.packaging]
run = "jq empty release-please-config.json .release-please-manifest.json && yq '.' action.yml > /dev/null && shellcheck install.sh"
stage = "working"

# A throwaway picture for trying approve and accept on the proof host; never merged.
[check.demo-card]
run = 'mkdir -p "$FEARLEZZ_OUT/stills" && ffmpeg -loglevel error -f lavfi -i "color=c=$(cat demo/color):s=480x270" -vf "drawbox=x=40:y=40:w=400:h=60:color=white@0.9:t=fill,drawbox=x=40:y=130:w=260:h=24:color=white@0.6:t=fill" -frames:v 1 "$FEARLEZZ_OUT/stills/card.png"'
stage = "look"
stills = "stills/**/*.png"
inputs = ["demo/**"]
