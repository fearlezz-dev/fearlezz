# Fearlezz proves its own changes with built in pieces: devenv gives every check the
# toolchain, rust brings fmt, clippy and tests, safety scans for leaked credentials. Each check
# runs in a clean env inside `devenv shell`: only the base variables and the ones listed under
# `env` reach it.

use = ["devenv", "rust", "agents", "safety"]

# Prose needs no proof: an edit to it alone reruns no check.
no_proof = ["*.md", "docs/**", "LICENSE-*", ".gitignore"]

# Checks without inputs are keyed on every file outside no_proof. The tests keep inputs, as a
# speed hint: an edit to a workflow or install.sh would otherwise rerun the slowest check. They
# read the embedded agent skill and pieces, the fixtures, the proof workflow and README.md,
# which no_proof leaves out of the default key. They leave out ee/, which has checks of its own.
[check.tests]
inputs = ["crates/**/*.rs", "Cargo.toml", "crates/**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "skills/fearlezz/SKILL.md", "crates/fearlezz/presets/**", "crates/fearlezz/tests/fixtures/**", "README.md", ".github/workflows/proof.yml", "action.yml"]

# The proof host in ee/ is a Cargo workspace of its own, built to wasm, so the rust piece runs
# its checks there too (`fmt/ee`, `clippy/ee`, `tests/ee`). These read ee/ and the proof bundle
# crate it shares with the core, so other core edits never rerun them; `fmt/ee` reads the core's
# sources too, since `--all` checks them through the path dependency on the proof bundle crate.
[check."fmt/ee"]
inputs = ["ee/**", "crates/fearlezz-proof/**", "crates/**/*.rs"]

# All features, so the routes only the tests build in are linted too.
[check."clippy/ee"]
on = ["linux"]
run = "cargo clippy --all-targets --all-features --quiet --message-format=json"
inputs = ["ee/**", "crates/fearlezz-proof/**"]

# Builds the worker and drives it under wrangler dev against a fake GitHub.
[check."tests/ee"]
on = ["linux"]
inputs = ["ee/**", "crates/fearlezz-proof/**"]

# The proof host's page: its types, and its tests of how a live connection becomes what the
# page shows. That its types match the proof model is a test of tests/ee. devenv installs
# the page's packages as it enters the shell.
[check.ee-page-types]
run = "tsc -p ee/app"
stage = "working"
inputs = ["ee/app/**"]

[check.ee-page-tests]
run = "bun test ee/app --reporter=junit --reporter-outfile=\"$FEARLEZZ_OUT/junit.xml\""
stage = "working"
tests = "junit"
test_files = ["ee/app/src/**/*.test.ts"]
inputs = ["ee/app/**"]

[check.actionlint]
run = "actionlint"
stage = "working"

# action.yml is metadata, not a workflow, so it is parsed here instead.
[check.packaging]
run = "jq empty release-please-config.json .release-please-manifest.json && yq '.' action.yml > /dev/null && shellcheck install.sh"
stage = "working"

# macOS proves only what Linux cannot: it lints the code only macOS compiles (recording, window
# parking, copy on write clones) and runs the tests that reach it. Their inputs are the files
# that code lives in and the pinned toolchain, so a change elsewhere reuses the base commit's macOS pass and has no macOS
# leg. They show no red before green: the same tests run on Linux, which shows it.
[check."clippy/macos"]
on = ["macos"]
run = "cargo clippy --all-targets --quiet --message-format=json"
stage = "working"
findings = { read = "cargo", lints = ["clippy", "rustc"] }
inputs = ["crates/fearlezz/src/record.rs", "crates/fearlezz/src/record/**", "crates/fearlezz/src/env.rs", "Cargo.toml", "crates/fearlezz/Cargo.toml", "Cargo.lock", "clippy.toml", "devenv.nix", "devenv.lock"]

# The window parking units, and the env tests whose fresh checkout clones folders (clonefile).
# A filter that matches no test fails the check, since it then counts zero.
[check."tests/macos"]
on = ["macos"]
run = "cargo test --quiet -p fearlezz --bin fearlezz --test env -- record::place:: cloned prepare"
stage = "working"
tests = { count = 'test result: \w+\. (\d+) passed; (\d+) failed', failed = '(?m)^---- (.+?) stdout ----$' }
inputs = ["crates/fearlezz/src/record.rs", "crates/fearlezz/src/record/**", "crates/fearlezz/src/env.rs", "crates/fearlezz/tests/env.rs", "crates/fearlezz/tests/common/**", "Cargo.toml", "crates/fearlezz/Cargo.toml", "Cargo.lock", "devenv.nix", "devenv.lock"]

# CI proves the commit in legs, Linux every check but the two above. Locally the developer's
# machine stands in for both.
[platform.linux]
runs-on = "ubuntu-latest"
default = true

[platform.macos]
runs-on = "macos-latest"
os = "macos"
