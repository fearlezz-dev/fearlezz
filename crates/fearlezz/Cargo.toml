[package]
name = "fearlezz"
version = "0.1.0"
edition = "2024"
description = "Proof for work done by AI agents: checks, journals and looks on the lines a change touched."
license = "MIT OR Apache-2.0"
repository = "https://github.com/fearlezz-dev/fearlezz"
readme = "../../README.md"
keywords = ["agents", "ci", "testing", "proof", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.21"
hex = "0.4.3"
jiff = { version = "0.2.42", features = ["serde"] }
libc = "0.2.191"
regex = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
toml = "1.2.1"
toml_edit = "0.25.19"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

[lints]
workspace = true
