# React: the rules of Biome's react domain (hooks, keys, props) and of oxlint's react plugins,
# for whichever of the two runs. With `biome` or `oxlint`; `setup init` adds it when
# package.json depends on react.

[lints.biome]
"correctness/noChildrenProp" = "gate"
"correctness/noNestedComponentDefinitions" = "gate"
"correctness/noReactPropAssignments" = "flag"
"correctness/noRenderReturnValue" = "gate"
"correctness/useExhaustiveDependencies" = "gate"
"correctness/useHookAtTopLevel" = "gate"
"correctness/useJsxKeyInIterable" = "gate"
"correctness/useUniqueElementIds" = "flag"
"nursery/noReactObjectTypeAsDefaultProp" = "off"
"nursery/useReactCompiler" = "off"
"nursery/useReactFunctionComponentDefinition" = "off"
"nursery/useReactNamingConvention" = "off"
"performance/noJsxPropsBind" = "hint"
"performance/noSyncScripts" = "flag"
"security/noDangerouslySetInnerHtml" = "gate"
"security/noDangerouslySetInnerHtmlWithChildren" = "gate"
"style/useComponentExportOnlyModules" = "hint"
"style/useReactFunctionComponents" = "flag"
"suspicious/noArrayIndexKey" = "gate"
"suspicious/noDuplicatedSpreadProps" = "gate"
"suspicious/noLeakedRender" = "flag"
"suspicious/noReactForwardRef" = "flag"
"suspicious/noUnknownAttribute" = "flag"

# The same framework's oxlint rules, at levels inferred like the oxlint piece's.
[lints.oxlint]
"react/button-has-type" = "gate"
"react/capitalized-calls" = "flag"
"react/checked-requires-onchange-or-readonly" = "flag"
"react/display-name" = "flag"
"react/error-boundaries" = "flag"
"react/exhaustive-deps" = "gate"
"react/exhaustive-effect-dependencies" = "flag"
"react/forbid-component-props" = "off"
"react/forbid-dom-props" = "off"
"react/forbid-elements" = "off"
"react/forward-ref-uses-ref" = "gate"
"react/function-component-definition" = "off"
"react/globals" = "gate"
"react/hook-use-state" = "hint"
"react/hooks" = "flag"
"react/iframe-missing-sandbox" = "flag"
"react/immutability" = "gate"
"react/incompatible-library" = "flag"
"react/invariant" = "off"
"react/jsx-boolean-value" = "flag"
"react/jsx-curly-brace-presence" = "off"
"react/jsx-filename-extension" = "off"
"react/jsx-fragments" = "flag"
"react/jsx-handler-names" = "off"
"react/jsx-key" = "gate"
"react/jsx-max-depth" = "off"
"react/jsx-no-comment-textnodes" = "gate"
"react/jsx-no-constructed-context-values" = "flag"
"react/jsx-no-duplicate-props" = "gate"
"react/jsx-no-literals" = "off"
"react/jsx-no-script-url" = "gate"
"react/jsx-no-target-blank" = "gate"
"react/jsx-no-undef" = "gate"
"react/jsx-no-useless-fragment" = "flag"
"react/jsx-pascal-case" = "flag"
"react/jsx-props-no-spread-multi" = "gate"
"react/jsx-props-no-spreading" = "off"
"react/memo-dependencies" = "flag"
"react/no-array-index-key" = "gate"
"react/no-children-prop" = "gate"
"react/no-clone-element" = "hint"
"react/no-danger" = "gate"
"react/no-danger-with-children" = "gate"
"react/no-deriving-state-in-effects" = "hint"
"react/no-did-mount-set-state" = "gate"
"react/no-did-update-set-state" = "gate"
"react/no-direct-mutation-state" = "gate"
"react/no-find-dom-node" = "gate"
"react/no-is-mounted" = "gate"
"react/no-multi-comp" = "off"
"react/no-namespace" = "flag"
"react/no-object-type-as-default-prop" = "off"
"react/no-react-children" = "hint"
"react/no-redundant-should-component-update" = "flag"
"react/no-render-return-value" = "gate"
"react/no-set-state" = "off"
"react/no-string-refs" = "gate"
"react/no-this-in-sfc" = "gate"
"react/no-unescaped-entities" = "flag"
"react/no-unknown-property" = "flag"
"react/no-unsafe" = "gate"
"react/no-unstable-nested-components" = "flag"
"react/no-will-update-set-state" = "gate"
"react/only-export-components" = "flag"
"react/prefer-es6-class" = "off"
"react/prefer-function-component" = "hint"
"react/preserve-manual-memoization" = "flag"
"react/purity" = "gate"
"react/react-in-jsx-scope" = "off"
"react/refs" = "gate"
"react/require-render-return" = "off"
"react/rule-suppression" = "off"
"react/rules-of-hooks" = "gate"
"react/self-closing-comp" = "flag"
"react/set-state-in-effect" = "flag"
"react/set-state-in-render" = "gate"
"react/state-in-constructor" = "off"
"react/static-components" = "gate"
"react/style-prop-object" = "flag"
"react/syntax" = "flag"
"react/todo" = "off"
"react/unsupported-syntax" = "off"
"react/use-memo" = "gate"
"react/void-dom-elements-no-children" = "gate"
"react/void-use-memo" = "gate"
"react-perf/jsx-no-jsx-as-prop" = "off"
"react-perf/jsx-no-new-array-as-prop" = "off"
"react-perf/jsx-no-new-function-as-prop" = "off"
"react-perf/jsx-no-new-object-as-prop" = "off"
