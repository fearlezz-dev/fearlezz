# A Flutter app: the dart piece's formatting and analyzer, and the tests through Flutter.
# `flutter test` runs test/ only; integration_test/app_test.dart is the entry file the
# flutter-film check of flutter-look runs.
use = ["dart"]

[check.dart-test]
off = true

# The last line says "+12: All tests passed!" or "+10 -2: Some tests failed.".
# Its lcov report flags each changed line no test ran.
[check.flutter-test]
each = "pubspec.yaml"
run = "flutter test --coverage --coverage-path=\"$FEARLEZZ_OUT/lcov.info\""
stage = "working"
tests = { count = '\+(\d+)(?: ~\d+)?(?: -(\d+))?: (?:All tests passed|Some tests failed)' }
coverage = "lcov"
test_files = ["**/test/**"]

# Flutter's own excludes come too: every flutter command appends build/** and each platform
# folder the app has to this list when one is missing, so a list without them never stays in sync.
[settings.dart-analysis.analyzer]
exclude = ["**/*.freezed.dart", "**/*.g.dart", "build/**", "android/**", "ios/**", "web/**", "windows/**", "macos/**", "linux/**"]
