# A Flutter app: formatting, the analyzer, and the tests.
#
# `flutter test` runs test/ only, so no check here reads a *_test.dart in integration_test/:
# one nothing runs is no proof of itself, and the floor names it unproven. The exception is
# integration_test/app_test.dart, the entry file the flutter-film check of flutter-look runs.

[check.dart-format]
run = "dart format --output=none --set-exit-if-changed ."
stage = "working"
inputs = ["**/*.dart", "!integration_test/**/*_test.dart", "integration_test/app_test.dart"]

# Lint findings get the level [lints.dart] gives them; other analyzer issues block. Only lines
# the change touched count; compile errors block wherever they are.
[check.dart-analyze]
run = "dart analyze --format=machine"
stage = "working"
inputs = ["**/*.dart", "!integration_test/**/*_test.dart", "integration_test/app_test.dart", "analysis_options.yaml", "pubspec.yaml", "pubspec.lock"]
findings = { read = "dart", lints = ["dart"] }

# The last line says "+12: All tests passed!" or "+10 -2: Some tests failed.".
[check.flutter-test]
run = "flutter test"
stage = "working"
tests = { count = '\+(\d+)(?: ~\d+)?(?: -(\d+))?: (?:All tests passed|Some tests failed)' }
inputs = ["**/*.dart", "!integration_test/**", "pubspec.yaml", "pubspec.lock"]
test_files = ["test/**"]

# Flutter's own excludes come too: every flutter command appends build/** and each platform
# folder the app has to this list when one is missing, so a list without them never stays in sync.
[settings.dart-analysis.analyzer]
exclude = ["**/*.freezed.dart", "**/*.g.dart", "build/**", "android/**", "ios/**", "web/**", "windows/**", "macos/**", "linux/**"]

# Analyzer diagnostics that are not lints.
[settings.dart-analysis.analyzer.errors]
invalid_annotation_target = "ignore"

# Every Dart lint rule, decided once on the maintainer's Lint Desk: gate means it must never
# happen, flag means there is little or no reason for it, hint means there can be a reason so
# an agent looks again, off means it does not run.
[lints.dart]
always_declare_return_types = "flag"
always_put_control_body_on_new_line = "off"
always_put_required_named_parameters_first = "hint"
always_specify_types = "off"
always_use_package_imports = "gate"
annotate_overrides = "gate"
annotate_redeclares = "flag"
async_return_with_no_await = "flag"
avoid_annotating_with_dynamic = "flag"
avoid_bool_literals_in_conditional_expressions = "gate"
avoid_catches_without_on_clauses = "flag"
avoid_catching_errors = "flag"
avoid_classes_with_only_static_members = "flag"
avoid_double_and_int_checks = "flag"
avoid_dynamic_calls = "flag"
avoid_empty_else = "gate"
avoid_equals_and_hash_code_on_mutable_classes = "flag"
avoid_escaping_inner_quotes = "hint"
avoid_field_initializers_in_const_classes = "flag"
avoid_final_parameters = "hint"
