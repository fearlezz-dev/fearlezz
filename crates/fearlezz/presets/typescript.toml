# TypeScript and JavaScript with Biome (lint and formatting), the type checker, and Vitest.
# A project on another test runner overrides the vitest check's run and its JUnit path.

# Lint findings get the level [lints.biome] gives them. Only lines the change touched count.
[check.biome-lint]
run = "biome lint --reporter=sarif ."
stage = "working"
findings = { read = "sarif", lints = ["biome"] }

[check.biome-format]
run = "biome format ."
stage = "working"

[check.tsc]
run = "tsc --noEmit"
stage = "working"

[check.vitest]
run = "vitest run --reporter=default --reporter=junit --outputFile.junit=\"$FEARLEZZ_OUT/junit.xml\""
stage = "working"
tests = "junit"
test_files = ["**/*.test.*", "**/*.spec.*", "**/__tests__/**"]

# Strictness switches, decided on the Lint Desk.
[settings.tsconfig.compilerOptions]
allowUnreachableCode = false
allowUnusedLabels = false
alwaysStrict = true
exactOptionalPropertyTypes = true
isolatedModules = true
noFallthroughCasesInSwitch = true
noImplicitAny = true
noImplicitOverride = true
noImplicitReturns = true
noImplicitThis = true
noPropertyAccessFromIndexSignature = false
noUncheckedIndexedAccess = true
noUnusedLocals = true
noUnusedParameters = true
strict = true
strictBindCallApply = true
strictFunctionTypes = true
strictNullChecks = true
strictPropertyInitialization = true
useUnknownInCatchVariables = true
verbatimModuleSyntax = true

# Biome checks the files Fearlezz writes (agent settings, hooks, skill copies) in the layout Fearlezz
# gives them, so it leaves them alone.
[settings.biome.files]
includes = ["**", "!.claude", "!.agents", "!.codex", "!.cursor"]

# The rules are the ones Biome 2.6.6 knows; Biome rejects a rule it does not know, so a rule
# joins this list only once a released Biome has it (the new ones start in nursery).
# Every rule, decided once on the maintainer's Lint Desk: gate means it must never happen, flag
# means there is little or no reason for it, hint means there can be a reason so an agent looks
