# TypeScript and JavaScript: the type checker and its strictness. Linting and formatting come
# with the piece of their tool (biome, eslint, oxlint, prettier), the tests with the piece of
# their runner (vitest, bun, node-test).

[check.tsc]
run = "tsc --noEmit"
stage = "working"

# Strictness switches, decided on the Lint Desk.
[settings.tsconfig.compilerOptions]
allowUnreachableCode = false
allowUnusedLabels = false
alwaysStrict = true
exactOptionalPropertyTypes = true
isolatedModules = true
noFallthroughCasesInSwitch = true
noImplicitAny = true
noImplicitOverride = true
noImplicitReturns = true
noImplicitThis = true
noPropertyAccessFromIndexSignature = false
noUncheckedIndexedAccess = true
noUnusedLocals = true
noUnusedParameters = true
strict = true
strictBindCallApply = true
strictFunctionTypes = true
strictNullChecks = true
strictPropertyInitialization = true
useUnknownInCatchVariables = true
verbatimModuleSyntax = true
