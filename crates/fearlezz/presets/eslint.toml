# ESLint with typescript-eslint. Fearlezz writes eslint.fearlezz.mjs; spread it into
# eslint.config.* after the configs that register the plugins.

# Findings get the level [lints.eslint] gives them. Only lines the change touched count; parse
# errors block wherever they are.
[check.eslint]
run = "eslint --format json ."
stage = "working"
inputs = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs", "eslint.config.*", "eslint.fearlezz.mjs", "package.json"]
findings = { read = "eslint", lints = ["eslint"] }

# Every rule, decided once on the maintainer's Lint Desk: gate means it must never happen, flag
# means there is little or no reason for it, hint means there can be a reason so an agent looks
# again, off means it does not run.
[lints.eslint]
"@typescript-eslint/adjacent-overload-signatures" = "flag"
"@typescript-eslint/array-type" = "flag"
"@typescript-eslint/await-thenable" = "gate"
"@typescript-eslint/ban-ts-comment" = "gate"
"@typescript-eslint/ban-tslint-comment" = "flag"
"@typescript-eslint/class-literal-property-style" = "flag"
"@typescript-eslint/class-methods-use-this" = "hint"
"@typescript-eslint/consistent-generic-constructors" = "flag"
