# Kotlin with ktlint (style), detekt (code smells) and the Gradle tests. `./gradlew test` runs
# unit tests only, not the instrumented tests in src/androidTest/.

# Findings get the level [lints.ktlint] and [lints.detekt] give them. Only lines the change
# touched count.
[check.ktlint]
run = "ktlint --reporter=sarif,output=$FEARLEZZ_OUT/findings.sarif '**/*.kt' '**/*.kts'"
stage = "working"
inputs = ["**/*.kt", "**/*.kts", ".editorconfig"]
findings = { read = "sarif", lints = ["ktlint"] }

[check.detekt]
run = "detekt --config config/detekt/detekt.yml --report sarif:$FEARLEZZ_OUT/findings.sarif"
stage = "working"
inputs = ["**/*.kt", "**/*.kts", "config/detekt/detekt.yml"]
findings = { read = "sarif", lints = ["detekt"] }

# --rerun runs the tests even when Gradle thinks they are up to date, so this run writes the
# reports it is judged on.
[check.gradle-test]
run = "./gradlew test --rerun"
stage = "working"
tests = { junit = "**/build/test-results/test/*.xml" }
inputs = ["**/*.kt", "**/*.kts", "**/*.java", "gradle/**", "gradle.properties", "**/src/test/resources/**"]
test_files = ["**/src/test/**"]

# The rule list names rules of newer detekt releases too; detekt skips the ones it lacks.
[settings.detekt.config]
validation = false

# Every rule, decided once on the maintainer's Lint Desk: gate means it must never happen, flag
# means there is little or no reason for it, hint means there can be a reason so an agent looks
