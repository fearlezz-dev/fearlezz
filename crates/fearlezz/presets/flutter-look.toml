# Looks of a Flutter app: stills and films, compared with the same check run on the base commit.
#
# flutter-look: widget tests in look_test/ render stills headlessly. No window, no simulator,
# no Screen Recording, so it runs anywhere, CI included. `fearlezz setup sync` writes the
# helpers into look_test/ (real fonts, and `still(tester, "home")` around a widget wrapped in
# `lookable(...)`). Text renders a little differently per OS; a look only ever compares runs
# on the same machine.
#
# flutter-film: integration tests in integration_test/ drive the macOS app while Fearlezz films
# its window from outside (macOS with Screen Recording). The app needs the integration_test
# dev dependency. Turn it off with `[check.flutter-film] off = true` for an app without them.

[check.flutter-look]
run = "flutter test look_test"
stage = "look"
tests = { count = '\+(\d+)(?: ~\d+)?(?: -(\d+))?: (?:All tests passed|Some tests failed)' }
inputs = ["lib/**", "look_test/**", "assets/**", "fonts/**", "pubspec.yaml", "pubspec.lock"]

[check.flutter-film]
run = "flutter test integration_test -d macos"
stage = "merge"
tests = { count = '\+(\d+)(?: ~\d+)?(?: -(\d+))?: (?:All tests passed|Some tests failed)' }
inputs = ["lib/**", "integration_test/**", "macos/**", "assets/**", "fonts/**", "pubspec.yaml", "pubspec.lock"]
record = { film = "app" }

[settings.flutter-look]
