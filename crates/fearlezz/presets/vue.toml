# Vue: the rules of Biome's vue domain and of oxlint's vue plugin, for whichever of the two
# runs. With `biome` or `oxlint`; `setup init` adds it when package.json depends on vue.

[lints.biome]
"correctness/noVueDataObjectDeclaration" = "gate"
"correctness/noVueDuplicateKeys" = "gate"
"correctness/noVueReservedKeys" = "gate"
"correctness/noVueReservedProps" = "gate"
"correctness/noVueSetupPropsReactivityLoss" = "off"
"correctness/noVueVIfWithVFor" = "gate"
"correctness/useVueVForKey" = "gate"
"correctness/useVueValidTemplateRoot" = "gate"
"correctness/useVueValidVBind" = "gate"
"correctness/useVueValidVCloak" = "gate"
"correctness/useVueValidVElse" = "gate"
"correctness/useVueValidVElseIf" = "gate"
"correctness/useVueValidVHtml" = "gate"
"correctness/useVueValidVIf" = "gate"
"correctness/useVueValidVOn" = "gate"
"correctness/useVueValidVOnce" = "gate"
"correctness/useVueValidVPre" = "gate"
"correctness/useVueValidVText" = "gate"
"nursery/noVueDeprecatedScopedSlots" = "off"
"nursery/noVueUndeclaredDirectives" = "off"
"nursery/useVueBaseImport" = "off"
"performance/useVueVapor" = "off"
"style/noVueOptionsApi" = "off"
"style/useVueConsistentVBindStyle" = "flag"
"style/useVueConsistentVOnStyle" = "flag"
"style/useVueDefineMacrosOrder" = "off"
"style/useVueHyphenatedAttributes" = "flag"
"style/useVueMultiWordComponentNames" = "flag"
"suspicious/noVueArrowFuncInWatch" = "gate"

# The same framework's oxlint rules, at levels inferred like the oxlint piece's.
[lints.oxlint]
"vue/component-definition-name-casing" = "hint"
"vue/define-emits-declaration" = "hint"
"vue/define-props-declaration" = "hint"
"vue/define-props-destructuring" = "off"
"vue/max-props" = "off"
"vue/next-tick-style" = "off"
"vue/no-arrow-functions-in-watch" = "gate"
"vue/no-async-in-computed-properties" = "gate"
"vue/no-computed-properties-in-data" = "gate"
"vue/no-deprecated-data-object-declaration" = "gate"
"vue/no-deprecated-delete-set" = "gate"
"vue/no-deprecated-destroyed-lifecycle" = "gate"
"vue/no-deprecated-events-api" = "gate"
"vue/no-deprecated-model-definition" = "gate"
"vue/no-deprecated-props-default-this" = "gate"
"vue/no-deprecated-vue-config-keycodes" = "gate"
"vue/no-dupe-keys" = "gate"
"vue/no-export-in-script-setup" = "gate"
"vue/no-expose-after-await" = "gate"
"vue/no-import-compiler-macros" = "flag"
"vue/no-lifecycle-after-await" = "gate"
"vue/no-multiple-slot-args" = "flag"
"vue/no-required-prop-with-default" = "flag"
"vue/no-reserved-component-names" = "gate"
"vue/no-reserved-keys" = "gate"
"vue/no-reserved-props" = "gate"
"vue/no-shared-component-data" = "gate"
"vue/no-side-effects-in-computed-properties" = "gate"
"vue/no-this-in-before-route-enter" = "gate"
"vue/no-watch-after-await" = "gate"
"vue/prefer-import-from-vue" = "off"
"vue/prop-name-casing" = "hint"
"vue/require-default-export" = "flag"
"vue/require-default-prop" = "hint"
"vue/require-direct-export" = "off"
"vue/require-prop-type-constructor" = "gate"
"vue/require-prop-types" = "hint"
"vue/require-render-return" = "gate"
"vue/require-slots-as-functions" = "gate"
"vue/require-typed-ref" = "flag"
"vue/return-in-computed-property" = "gate"
"vue/return-in-emits-validator" = "gate"
"vue/valid-define-emits" = "gate"
"vue/valid-define-options" = "gate"
"vue/valid-define-props" = "gate"
"vue/valid-next-tick" = "gate"
