# A Cargo project: formatting, clippy, and the tests.

[check.fmt]
run = "cargo fmt --all --check"
stage = "working"
inputs = ["**/*.rs", "rustfmt.toml", ".rustfmt.toml"]

# Lints are findings with the level [lints.clippy] and [lints.rustc] give them; only lines the
# change touched count. Compile errors block wherever they are.
[check.clippy]
run = "cargo clippy --all-targets --quiet --message-format=json"
stage = "working"
findings = { read = "cargo", lints = ["clippy", "rustc"] }
inputs = ["**/*.rs", "**/Cargo.toml", "Cargo.lock", "clippy.toml", "rust-toolchain.toml"]

[check.tests]
run = "cargo test --quiet"
stage = "working"
# Each test binary prints "test result: ok. N passed; M failed; ...".
tests = { count = 'test result: \w+\. (\d+) passed; (\d+) failed' }
inputs = ["**/*.rs", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
# Integration tests live in tests folders; unit tests inside src cannot be told apart
# from the code, so only the former show red before green.
test_files = ["**/tests/**"]

# Production code never unwraps or panics; tests may.
[settings.clippy]
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Every clippy and rustc lint, decided once on the maintainer's Lint Desk: gate means it must
# never happen, flag means there is little or no reason for it, hint means there can be a
# reason so an agent looks again, off means it does not run. Lints the compiler or clippy
# already deny are left at that default.

[lints.clippy]
absolute_paths = "off"
alloc_instead_of_core = "off"
allow_attributes = "hint"
