# Go: golangci-lint, formatting, and the tests.

# Findings get the level [lints.golangci] gives them. Only lines the change touched count.
[check.lint]
run = "golangci-lint run --output.sarif.path=stdout --output.text.path=stderr --show-stats=false ./..."
stage = "working"
inputs = ["**/*.go", "go.mod", "go.sum", ".golangci.yml", ".golangci.yaml", ".golangci.toml", ".golangci.json"]
findings = { read = "sarif", lints = ["golangci"] }

[check.format]
run = "test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }"
stage = "working"
inputs = ["**/*.go"]

# -v prints one "--- PASS" or "--- FAIL" line per test and subtest, which are counted.
[check.tests]
run = "go test -v ./..."
stage = "working"
tests = { count = '(?m)^\s*--- (?:PASS|FAIL):' }
inputs = ["**/*.go", "go.mod", "go.sum"]

# Every rule, decided once on the maintainer's Lint Desk: gate means it must never happen, flag
# means there is little or no reason for it, hint means there can be a reason so an agent looks
# again, off means it does not run.
[lints.golangci]
arangolint = "off"
asasalint = "gate"
asciicheck = "off"
bidichk = "gate"
bodyclose = "gate"
canonicalheader = "flag"
clickhouselint = "off"
containedctx = "flag"
contextcheck = "flag"
copyloopvar = "gate"
cyclop = "off"
decorder = "off"
depguard = "off"
dogsled = "off"
dupl = "off"
dupword = "flag"
durationcheck = "gate"
embeddedstructfieldcheck = "off"
err113 = "flag"
errcheck = "gate"
errchkjson = "gate"
errname = "flag"
errorlint = "gate"
exhaustive = "gate"
exhaustruct_v5 = "off"
exptostd = "flag"
fatcontext = "flag"
forbidigo = "off"
forcetypeassert = "flag"
funcorder = "off"
funlen = "flag"
ginkgolinter = "off"
gocheckcompilerdirectives = "gate"
gochecknoglobals = "hint"
gochecknoinits = "hint"
gochecksumtype = "gate"
gocognit = "flag"
goconst = "off"
gocritic = "flag"
gocyclo = "flag"
godoclint = "off"
godot = "off"
godox = "off"
goheader = "off"
gomoddirectives = "flag"
gomodguard_v2 = "off"
goprintffuncname = "flag"
gosec = "flag"
gosmopolitan = "off"
govet = "gate"
grouper = "off"
