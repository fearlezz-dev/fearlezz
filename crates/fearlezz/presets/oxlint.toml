# oxlint lints TypeScript and JavaScript, with type information (`--type-aware`, which needs
# tsgolint beside it; nixpkgs' oxlint has it). Fearlezz writes .oxlintrc.json: every rule below
# with its level and every category off, so a rule a newer oxlint adds runs only once it has a
# level. The rules of a framework come with its own piece (react, next, vue).

# Findings get the level [lints.oxlint] gives them. Only lines the change touched count.
[check.oxlint]
run = "oxlint --type-aware --format=sarif"
stage = "working"
findings = { read = "sarif", lints = ["oxlint"] }

# Every rule, at the level of the rule the Lint Desk decided for ESLint or Biome when one is the
# same rule, and otherwise at the level decided for rules like it (same plugin and category),
# corrected where a rule clashes with another, bans modern syntax, is a formatter's work or
# repeats what TypeScript checks. docs/drive/language-pieces/oxlint-levels.tsv says which.
