name: Fearlezz proof
description: Prove a change with the checks in fearlezz.toml, and show the status and changed pictures on the pull request.

# Installs Fearlezz and runs `fearlezz run --ci`, which does what the event asks: a pull request
# or push is proven, a `/fearlezz approve` comment approved, and a closed pull request or the
# schedule cleans up the pictures branch.
inputs:
  version:
    description: >-
      Fearlezz to install: a release tag (for example v0.2.0), `latest` (the release of the
      action's own tag when it is taken at one, otherwise the newest), or `installed` (the one
      already on PATH).
    default: latest
  devenv:
    description: Install Nix and devenv first, for projects whose checks run in a devenv shell.
    default: "false"
  token:
    description: Token that writes the comment, the pictures status and the pictures branch.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - if: inputs.devenv == 'true'
      uses: cachix/install-nix-action@v31
    - if: inputs.devenv == 'true'
      uses: cachix/cachix-action@v16
      with:
        name: devenv
    - if: inputs.devenv == 'true'
      shell: bash
      run: nix profile install nixpkgs#devenv
    - name: Install Fearlezz
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        FEARLEZZ_INSTALL_DIR: ${{ runner.temp }}/fearlezz-bin
      run: |
        # The action taken at a release tag installs that release, so the two always fit.
        if [ "$VERSION" = latest ] && [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VERSION=$ACTION_REF; fi
        if [ "$VERSION" != installed ]; then
          if [ "$VERSION" != latest ]; then export FEARLEZZ_VERSION=$VERSION; fi
          sh "$GITHUB_ACTION_PATH/install.sh"
          echo "$FEARLEZZ_INSTALL_DIR" >> "$GITHUB_PATH"
          PATH="$FEARLEZZ_INSTALL_DIR:$PATH"
        fi
        if ! fearlezz run --help | grep -q "GitHub Actions"; then
          echo "::error::$(fearlezz --version) is too old for this action. Set version: to a newer release, or take the action at the tag of the release you install (fearlezz-dev/fearlezz@vX.Y.Z)."
          exit 1
        fi
    # The ffmpeg Fearlezz installs when a check records pictures.
    - uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/fearlezz-ffmpeg
        key: fearlezz-ffmpeg-b6.1.1-${{ runner.os }}-${{ runner.arch }}
    - name: Fearlezz
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: fearlezz run --ci
    - name: Keep the changed pictures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fearlezz-pictures
        path: ${{ runner.temp }}/fearlezz-pictures
        if-no-files-found: ignore
    - name: Keep the output of every check
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proof-logs
        path: .git/fearlezz/results/**/output.log
        include-hidden-files: true
        if-no-files-found: ignore
