# The proof host. Its secrets (secretspec.toml, kept in 1Password) reach the Worker through
# the devenv task host-push-secrets, and host-deploy deploys it; the tests pass every setting
# with `wrangler dev --var`. The worker answers on both origins below, so both route to it.
name = "fearlezz-host"
main = "build/index.js"
compatibility_date = "2026-10-01"

# The Worker runs beside its D1 database (in Western Europe), not beside the person: one write
# makes some twenty queries one after another, and from the far side of the world each would
# cross it. The rooms get the same region (`room::REGION`).
[placement]
mode = "smart"
hint = "weur"

# Both origins are custom domains of this Worker: the app, and the proof files on another site.
routes = [
  { pattern = "fearlezz.seamlezz.com", custom_domain = true },
  { pattern = "fearlezz.seamlezz.net", custom_domain = true },
]

# The page (ee/app) is built first: the worker serves it as static assets. HOST_FEATURES names
# cargo features of the worker: the tests set it to `test-hooks`, a deploy leaves it unset.
[build]
command = "bun install --frozen-lockfile --cwd ../app && bun run --cwd ../app build && worker-build --release ${HOST_FEATURES:+--features $HOST_FEATURES}"

# The page: the worker answers every path itself (who may see a work comes first) and fetches
# the page from here; only the hashed scripts and styles under /assets are served directly.
[assets]
directory = "../app/dist"
binding = "ASSETS"
run_worker_first = ["/*", "!/assets/*"]
html_handling = "none"
not_found_handling = "none"

# One room per piece of work and one per repository, holding the live connections of the pages
# open on it.
[[durable_objects.bindings]]
name = "WORK"
class_name = "WorkRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkRoom"]

[vars]
# Where people sign in and CI streams its runs.
APP_ORIGIN = "https://fearlezz.seamlezz.com"
# Where the runs' files are served: another site, so nothing CI wrote can use the sign in.
FILES_ORIGIN = "https://fearlezz.seamlezz.net"
# The host's origin, which CI asks its OIDC token for: APP_ORIGIN, the default host of the core.
AUDIENCE = "https://fearlezz.seamlezz.com"
OIDC_ISSUER = "https://token.actions.githubusercontent.com"
OIDC_JWKS = "https://token.actions.githubusercontent.com/.well-known/jwks"
GITHUB_API = "https://api.github.com"
# Where people sign in.
GITHUB_WEB = "https://github.com"
# The Fearlezz GitHub App's client id: its OAuth client, and the issuer of its JWTs.
GITHUB_CLIENT_ID = "Iv23liJRwzB5ys23d4Z9"
INSTALL_URL = "https://github.com/apps/fearlezz-dev/installations/new"
# The lowest CLI version whose runs the host takes (`GET /api/v2/cli` names it). Raise it when
# the protocol changes in a way older CLIs cannot follow; a CLI that names no version counts as
# 0.0.0.
CLI_MINIMUM = "0.0.0"

[[r2_buckets]]
binding = "BLOBS"
# In Western Europe, as the database.
bucket_name = "fearlezz-bundles"

[[d1_databases]]
binding = "DB"
database_name = "fearlezz-proofs"
# In Western Europe; local runs and the tests use a local copy, never this one.
database_id = "ac62746a-bf66-4e97-8ae5-af025298186d"
migrations_dir = "migrations"

# Closes the local runs that said nothing for an hour (`api::close_silent`).
[triggers]
crons = ["*/10 * * * *"]
