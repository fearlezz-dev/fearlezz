[package]
name = "fearlezz-host"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# The proof bundle, shared with the core: proof.json and what in it waits for a person.
fearlezz-proof = { path = "../../crates/fearlezz-proof" }
worker = { version = "0.9.0", features = ["d1"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "CryptoKey", "SubtleCrypto", "WorkerGlobalScope"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
percent-encoding = "2"
url = "2"
