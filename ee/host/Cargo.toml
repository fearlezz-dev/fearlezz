[package]
name = "fearlezz-host"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Routes only the tests build in (`wrangler.toml` passes HOST_FEATURES to the build), never a
# deployed worker: `POST /__test/sql` runs a statement through the worker's own D1 binding.
test-hooks = []

[dependencies]
# The proof bundle, shared with the core: proof.json and what in it waits for a person.
fearlezz-proof = { path = "../../crates/fearlezz-proof" }
worker = { version = "0.9.0", features = ["d1"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortSignal", "Crypto", "CryptoKey", "SubtleCrypto", "WorkerGlobalScope"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
percent-encoding = "2"
url = "2"

[lints]
workspace = true

# worker-build runs wasm-opt on the worker; -Oz trades a little speed for size (482 KB gzip
# before, 410 KB with opt-level "z" beside it).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
