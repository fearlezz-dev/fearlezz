# The hosted parts: their own workspace, apart from the open core's, because the proof host is
# built to wasm and the core never depends on anything here.
[workspace]
resolver = "3"
members = ["host", "host-tests"]

[workspace.package]
edition = "2024"
publish = false

# The tests generate RSA keys; unoptimised that takes seconds per key.
[profile.dev.package."*"]
opt-level = 3

# The worker is built to wasm, where its size is what matters: "z" over "s" saves about 6%.
# Panics already abort on wasm32-unknown-unknown.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
