# docs/drive/off-screen-recording/record.yaml: the working state of one piece of work.
goal: "Recording off the developer's screens" (was ROADMAP Next); opt in, and absent (not failing) wherever it cannot work.

pieces:
  - id: placement
    status: done
    measured:
      - "ScreenCaptureKit listing 55 to 89 ms (median 70); CGWindowList 1.6 to 2.1 ms median"
      - "binary flash, AeroSpace on (ms): 1469, 425, 419, 3418, never parked once (window gone)"
      - "binary flash, AeroSpace off: 4 of 5 never parked (no AX window with the listed frame), one 329 ms" 
    tries:
      - id: spike-virtual-display
        what: CGVirtualDisplay, move the window there with AXPosition, record with ScreenCaptureKit
        taught: Recording on the virtual display works; the window opens on the main screen first.
        state: working
        evidence: [branch spike/virtual-display, crates/fearlezz/src/record/display.rs]
      - id: observer-move
        parent: spike-virtual-display
        what: Launch without activating; move the window on the AX window created notification instead of polling
        taught: "The window-created notification never fired; the app answers AX about 280 ms after spawn, its window already drawn. Measured on screen: 69 to 80 ms median, up to 390 ms, polling or AX alike. The app always takes focus (150 to 220 ms after spawn); handing it back takes 3 to 18 ms, away about 195 ms median. Under AeroSpace the cursor follows focus there and back."
        state: working
        evidence: [proto/off-screen/placement 2184d63, proto/off-screen/logs]
      - id: corner-park
        what: No virtual display; park the window in a screen corner (as AeroSpace hides windows) and record it with window capture
        taught: "Window capture returns the full, live window when almost all of it is off screen (macOS keeps a strip of about 40 by 32 points visible), and when AeroSpace hides it on a workspace not shown (1 px visible). No private API needed."
        state: picked
        why: The developer picked it over the virtual display; public API only.
        evidence: [proto/off-screen/placement 2184d63, proto/off-screen/stills]
      - id: vm
        what: Run the check inside a macOS VM (Virtualization.framework)
        taught: Full isolation and real input, but needs an image, toolchains inside the guest, minutes to boot, at most two VMs per Mac.
        state: trying
        evidence: [https://github.com/trycua/cua]
  - id: window-manager
    status: done
    open: AeroSpace parks the window once it has picked it up; any other manager that undoes the move is told in the log.
    tries:
      - id: ax-move-under-aerospace
        what: The spike's AXPosition move with AeroSpace running
        taught: AeroSpace snaps the window back within about 50 ms, tiled or floating; the spike's approach fails under AeroSpace.
        state: dropped
        why: AeroSpace owns window positions.
        evidence: [proto/off-screen/placement 2184d63]
      - id: aerospace-cli
        what: aerospace layout floating --window-id W, then move-node-to-monitor or move-node-to-workspace
        taught: "Keeps 800x600 and stays put; no focus change, no cursor move. A new display gets a new empty workspace; the developer's workspaces do not move and come back intact."
        state: working
        evidence: [proto/off-screen/placement 2184d63]
  - id: input
    status: done
    open: Out of scope (decided no-input).
    tries:
      - id: post-to-pid
        what: CGEventPostToPid without window fields
        taught: A Flutter app in the background on a virtual display ignored the clicks (spike).
        state: dropped
        why: Precedent says bare posts are dropped; window fields are needed.
        evidence: [spike/virtual-display display.rs click test]

decided:
  - id: no-agents-lines
    what: "None of these": no AGENTS.md lines for loaded machines, env var switches or recorder unit tests.
  - id: reliable-under-load
    what: "Assume that very often my system is very loaded. Everything needs to be very reliable, because if it's not, everything is going to conflict too much with each other."
  - id: fast-watch
    what: "Fast watch for all": CGWindowList every 10 ms finds new windows for every recording; ScreenCaptureKit only captures.
  - id: opt-in-env
    what: "Your machine": FEARLEZZ_OFF_SCREEN=1 in the developer's environment turns parking on for every project.
  - id: park-off-screen
    what: Park off screen (public API, no virtual display); a small corner strip stays visible on plain macOS, 1 px under AeroSpace.
  - id: no-input
    what: "We only care about actually moving the application to its own screen, because most harnesses like Codex and Claude already have tools to interact with the UI." The check's test drives the app; Fearlezz only films.
  - id: aerospace-decoupled
    what: "Don't couple this project to AeroSpace. If people have it, it can automatically help them, or they can configure it a little bit. Not having AeroSpace shouldn't break anything."
  - id: restore-saved-frames
    what: "Restore after run": the window positions an app saved while parked are put back once the command ends.
  - id: prototype-freedom
    what: "While testing, confuse the stuff as much as you want. While not testing, don't mess it up." The developer's desktop is restored after each try.


slices:
  - id: review-fixes-and-fast-watch
    tests:
      - record::tests::off_screen_gives_focus_back_before_parking_when_the_app_took_it_first
      - record::tests::off_screen_says_why_focus_is_not_given_back_when_it_cannot_read_focus
    status: done
    evidence:
      - "14 real runs, all passed: native 5 + Flutter 2 per AeroSpace state, stills and films"
      - "flash by Accessibility 114, 121, 124, 126, 140 ms; by AeroSpace 195, 289, 313, 445, 2286 ms"
      - "a stuck replayd made every film fail machine wide (first sample buffer); restarting it fixed it"
  - id: recorder-decisions
    tests:
      - record::tests::off_screen_parks_the_window_as_soon_as_it_appears_before_recording_it
      - record::tests::a_window_that_cannot_be_parked_is_recorded_where_it_opened_and_says_why
      - record::tests::without_off_screen_nothing_moves_and_the_log_says_how_to_turn_it_on
      - record::tests::off_screen_gives_focus_back_when_the_app_takes_it_while_it_settles
      - record::tests::off_screen_leaves_focus_the_developer_moved_to_another_app
    status: done
  - id: macos-parking
    tests: [real runs on the developer's machine, native and Flutter, AeroSpace on and off]
    status: done
    evidence:
      - "AeroSpace on: parked by AeroSpace, full window still 1280x864 (native) and 1600x1264 (Flutter); workspaces unchanged"
      - "AeroSpace off: parked by Accessibility, focus back after about 0.4 s; Flutter film still drawing while parked (counter 9 to 18)"
      - "Found: AeroSpace refused a window id it had not picked up yet; parking now waits up to 2 s for AeroSpace to list it"
  - id: saved-frames
    tests:
      - record::tests::off_screen_puts_back_the_saved_window_position_once_the_command_ended
      - record::tests::a_window_that_was_not_parked_has_no_position_to_put_back
      - record::tests::saved_positions_that_cannot_be_put_back_are_told_and_the_run_still_passes
    status: done
    evidence:
      - "a SwiftUI app that saves its frame reopened where it was in 4 of 4 cases: sandboxed and plain, by Accessibility and by AeroSpace; each log says it put back 1 position"
      - "read and written through the defaults tool: the CFPreferences API cannot reach a sandboxed app's container, and reads a stale cache by path"
      - "found: when a bundle id has a leftover sandbox container, defaults reads the container, so a plain app with that id is not put back (test leftover only)"
  - id: review-round-two
    tests:
      - record::tests::a_recording_that_fails_stops_the_command_before_putting_back_saved_positions
      - record::tests::off_screen_gives_focus_back_while_parking_waits_for_the_window_manager
      - record::tests::a_window_the_window_manager_never_picks_up_is_recorded_where_it_opened
    status: done
    evidence:
      - "a failed defaults read is an error, never an empty list that would delete saved positions"
      - "parking is one step of the settle loop, so focus goes back while AeroSpace picks the window up"
      - "6 real runs passed (AeroSpace on and off), focus given back in each; saved position put back in both"
      - "defaults export takes about 10 ms at load 33, so reading before the move adds little to the flash"


open:
  - id: film-failures
    ask: "Reproduced on main (998ceb8) too: after 27 good films during a load spike every film fails until replayd restarts. Existing problem, now in ROADMAP Known problems. Investigate as its own drive?"
  - id: aerospace-no-ax-focus
    ask: With AeroSpace on and Accessibility off, focus give back is unproven (needs Accessibility turned off for the agent's app).

