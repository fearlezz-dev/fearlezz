# docs/drive/ci-proof-loop/record.yaml: the working state of this piece of work.
goal: "The CI cannot be green because you didn't run the checks. It should be in the agent loop: the agent should figure out it skipped the proof while working."

pieces:
  - id: honest-verdict
    status: figuring-out
    open: What exactly makes "ready to merge" true, including work with no claims.
    tries:
      - id: one-derived-verdict
        what: One verdict derived in state.rs, used by next lines, agent hooks and the CI exit code.
        taught: Twelve scratch cases show ready to merge and exit 0 for work with no goal, unproven claims or an uncommitted edit.
        state: trying
        evidence: [scratchpad repro.sh, cases 3, 7, 8, 9, 12]
  - id: local-to-ci
    status: figuring-out
    open: How the goal and claims reach CI.
    tries:
      - id: committed-declarations
        what: The goal and claims are committed with the change; CI proves them again by running the bound checks.
        state: trying
      - id: ci-only
        what: CI judges only what it runs and never learns the claims.
        state: trying
      - id: out-of-band-receipt
        what: The journal or a receipt travels on a custom ref or git notes.
        state: trying
      - id: pull-request-body
        what: The goal and claims live in a block in the pull request body.
        state: trying
  - id: ci-floor
    status: figuring-out
    open: How a change is stopped from weakening its own proof.
    tries:
      - id: base-config-floor
        what: CI takes the required checks from the base branch's config, so a change can only add proof.
        taught: Turning a check off or narrowing its inputs in the change gives nothing to run and exit 0 today.
        state: trying
        evidence: [scratchpad repro.sh, cases 10, 11]
  - id: agent-loop
    status: figuring-out
    open: How hard the agent hooks should stop the agent.
    tries:
      - id: hooks-from-setup-sync
        what: setup sync writes agent hooks at session start, before push and pull request, and at stop.
        state: trying

decided:
  - id: claims-committed
    what: "How claims reach CI: a committed file per change, written by fearlezz say."
    why: Reviewers read it in the diff, and CI proves each claim again by running its check.

  - id: hooks-firm-at-the-door
    what: "Hooks are firm at the door: push needs a goal and a claim, a non-draft pull request needs ready, end of turn blocks once."
  - id: weakening-red-admin-bypass
    what: "A change that weakens its own proof is red and names the weakening; a person with admin rights merges past it after reading."
  - id: hooks-all-agents
    what: "All three agents get hooks; detect which ones the project uses, and let the project choose. Codex and Cursor stay untested for now."
  - id: env-in-floor
    what: "Any change to a check's env list is a weakening (Any change, recommended)."
  - id: settings-env-in-floor
    what: "Any change to the settings of a tool that judges code, or to [env], is a weakening (Any change, recommended)."
  - id: protect-main
    what: "main requires the proof check, set only by GitHub Actions; admins can bypass. Ruleset 27014534."

open:

slices:
  - id: honest-ready
    tests: [crates/fearlezz/tests/core.rs ready_*, ci_*]
    status: done
  - id: ci-mode
    tests: [crates/fearlezz/tests/ci.rs]
    status: done
  - id: claims-reach-ci
    tests: [crates/fearlezz/tests/ci.rs work file tests, crates/fearlezz/tests/core.rs say_writes_*, ready_needs_the_work_file_*]
    status: done
    note: the file is .fearlezz/work/<journal>.toml and stays after merging
  - id: agent-hooks
    tests: [crates/fearlezz/tests/hooks.rs]
    status: done
    note: Claude Code, Codex and Cursor; Codex and Cursor untested in the agents themselves
  - id: test-counts
    tests: [crates/fearlezz/tests/test_counts.rs]
    status: done
    note: a tests reader per check (cargo, junit), chosen over guessing from the command; zero tests or no count is red
  - id: floor-lints-rules-env
    tests: [crates/fearlezz/tests/ci.rs lints, rules and env tests]
    status: done
    note: "any change to a check's env list is red, chosen over only added variables, since a removed one can make tests skip quietly"
  - id: floor-settings-env
    tests: [crates/fearlezz/tests/ci.rs settings and env tests]
    status: done
    note: "any change to a code tool's settings or to [env] is red; agent settings, skill and hooks stay free; widening [env] inputs is fine"

next: Show the settings and env floor slice for review; the proof gate design is built.
