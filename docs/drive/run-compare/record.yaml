goal: "see the difference of what it detected between the last one and the new one", between runs (local runs too), not only base against this run, and make it very obvious what is going on

pieces:
  - id: compare-in-browser
    status: built
    tries:
      - id: wasm-spike
        what: copy media.rs math into a wasm crate, decode films in Chromium, compare with `setup compare --json`
        taught: same verdict, states, moments and boxes (0 px) on every pair; WebCodecs VP9 decode equals ffmpeg byte for byte; only the YUV to RGB step (ffmpeg varies by width and build) and canvas scaling differ; browser 1.5 to 2x the CLI, single threaded
        state: working
        evidence: [spike/wasm-compare 1575d2d, spike/wasm-compare/README.md, spike/wasm-compare/results/]
  - id: run-strip
    status: built
    open: none
    tries: []
  - id: one-same
    status: done
    tries:
      - id: current-blur
        what: today's comparison, blurred pixel diff over a fixed brightness gap
        taught: misses a real 12px move of the faint loading skeleton (connecting, max 22 of 255, 72k pixels) and calls it same
        state: dropped
        why: too loose for faint changes
        evidence: [scratchpad proto-compare/out.tsv over CI runs 44899471800, 44902937976, 44947970672, 44955200512]
      - id: pixelmatch-default
        what: pixelmatch, antialiasing ignored, threshold 0.1
        taught: also calls the faint skeleton move same
        state: dropped
        why: same blind spot
      - id: pixelmatch-low
        what: pixelmatch, antialiasing ignored, threshold 0.01 (about 2 levels)
        taught: every desktop flicker is 0 (they differ by 2 levels at most); phone flicker leaves at most 22 pixels; every real change on #59 is 650 or more; the skeleton move is 71k
        state: picked
        why: built in fearlezz-compare as stills' own diff (diff.rs still_diff), films keep their codec allowance; agrees with the prototype on all 137 real pairs (36 changed, 101 same)
        evidence: [crates/fearlezz-compare/tests/compare.rs, crates/fearlezz/tests/media.rs a_faint_move_in_a_still_is_a_change, render_jitter_in_a_still_is_the_same, scratchpad proto-compare/out-new.tsv]
      - id: neighbourhood
        what: a pixel changes only when nothing within 1 pixel in the other picture matches it
        taught: no better than pixelmatch-low on the phone flicker (45 left)
        state: dropped
        why: no gain
  - id: look-again-by-comparison
    status: built
    tries: []
  - id: film-marks
    status: built
    open: whether this project's films stop asking for a new look on CI (two CI runs to compare)
    tries:
      - id: retime-data
        what: the state times of the same films across CI runs
        taught: constant offsets of 0.1 to 0.2 s (the page loading) and steps of 0.3 to 1.2 s (waits on answers and comparisons); no visual regression tool aligns timing
        state: picked
        why: timing has to be anchored on what happened, not on the film's start
      - id: marks-and-spans
        what: a check writes marks (shown or hidden) and spans (timing same or free) to proof.jsonl; the comparison times each state from the anchor before it
        state: picked
        evidence: [crates/fearlezz-compare/tests/compare.rs a_box_*_mark*, crates/fearlezz/tests/look.rs a_film_that_loads_longer_before_its_mark_looks_the_same, crates/fearlezz/tests/host.rs an_approved_film_that_loaded_faster_is_alike_timed_from_its_marks, ee/compare/tests/feed.rs a_film_is_timed_from_its_marks, ee/app/e2e/compare.look.ts a film's timeline draws]
      - id: presses-as-marks
        what: this project's Playwright films note every key and pointer press in the page, and the loading as a free span (ee/app/e2e/marks.ts)
        state: working
  - id: render-noise
    status: dropped
    open: the floor makes it no change a person sees
    tries:
      - id: pixel-ratio
        what: render the phone at pixel ratio 1, 3, or without the shrink (scale device)
        taught: 29, 33 and 34 of 58 phone stills still differ across three local runs, so the pixel ratio is not the cause; the differences sit on pictures scaled inside the page (stage, thumbnails, up to 51 of 255) and the Live dot
        state: dropped
        why: not the cause
        evidence: [scratchpad jitter/]

decided:
  - id: strip
    what: "B. Strip of runs" above the picture, base, your look, local runs, now; click a dot to compare with it
  - id: diff-in-page
    what: "We should do it immediately locally in the web page, and we should use WASM to make it really fast", "then you still have one algorithm that does the diffing"
  - id: ci-keeps-base
    what: CI keeps comparing against the base (the review status and free CI need it); the page compares any other pair
  - id: films-first
    what: "Yes, prototype films first"
  - id: exact-parity
    what: "Yes, exact everywhere": the CLI reads raw yuv420p planes from ffmpeg, one shared Rust function converts to colour and scales, for the CLI, CI and the browser
  - id: look-again-default
    what: a Look again picture opens compared with "Your look"; other pictures open compared with the base
  - id: one-same-model
    what: "Yes, prove it first": one antialias aware comparison is the only meaning of same, and Look again is CI comparing now with the picture the person approved
  - id: floor
    what: "Ignore under ~30 px": a change of fewer than about 30 pixels (antialiasing already ignored) counts as the same
  - id: timing-is-look-again
    what: "Timing is Look again": a film that only changed its timing since the look asks for a new look
  - id: in-59
    what: part of #59, the same work on the review page (was a separate PR)
  - id: marks-model
    what: "visible markers and invisible markers", spans whose timing is same or free ("loading... should be ignorant to retimes... animation should still be the same")
  - id: marks-strict
    what: "Strict (Recommended)": after each mark the timing must match
  - id: marks-sources
    what: "Yes, those three (Recommended)": proof.jsonl lines, a Playwright helper, Fearlezz's own recorder; test.step and performance.mark later; OpenTelemetry not now (too noisy)

