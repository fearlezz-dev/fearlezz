      - crates/fearlezz/tests/look.rs (run_compares_stills_with_the_base_and_names_their_files, the_final_stage_is_ready_with_changed_pictures_and_names_them, say_approve_is_gone)
      - crates/fearlezz/tests/core.rs (the_overview_of_every_journal_is_text_and_writes_no_page, a_journal_from_before_approvals_were_removed_still_reads)
    status: built
  - id: host-v2-foundation
    tests:
      - crates/fearlezz/tests/host.rs (the_run_streams_to_the_host_while_its_checks_run, a_finished_check_sends_its_entry_and_output_and_only_missing_blobs, done_sends_the_files_the_host_still_lacks_and_closes_again, the_log_and_the_summary_link_the_hosts_page, the_token_is_asked_for_the_hosts_origin, nothing_leaves_ci_when_the_app_is_not_installed, without_the_id_token_permission_nothing_is_asked, a_host_that_fails_never_fails_the_proof, every_call_to_the_host_asks_for_a_fresh_token)
      - ee/host-tests/tests/host.rs (a_run_opens_and_answers_the_page_of_its_work, checks_stream_into_the_run, a_finished_check_asks_only_for_the_files_the_repository_lacks, done_is_refused_while_a_file_is_missing, a_run_takes_calls_only_from_its_own_repository_and_ref, a_closed_run_takes_nothing_more, a_run_for_another_pull_request_is_refused, a_run_for_another_branch_is_refused, the_work_page_is_served_for_a_navigation, an_unknown_work_is_not_found, the_files_origin_refuses_a_grant_for_another_run, a_page_shows_a_check_move_from_running_to_passed_live, a_page_opened_mid_run_shows_the_current_state, two_pages_both_update, and the kept sign in, access, OIDC and files tests)
      - ee/host-tests/tests/types.rs (the_pages_types_are_the_proof_model)
      - ee/app/src/live.test.ts (how a snapshot and events become the page's state)
    status: done
  - id: pictures-on-page
    tests:
      - crates/fearlezz/tests/host.rs (a_finished_check_sends_its_look_with_the_pictures)
      - ee/host-tests/tests/host.rs (a_finished_check_brings_its_look_to_the_page, a_look_of_another_check_is_refused, the_files_origin_serves_only_pictures_and_films, the_page_gets_a_grant_for_the_files_of_a_run_it_shows, the_work_page_is_served_for_a_navigation (CSP), the_page_shows_a_changed_picture_with_its_before_and_after, the_compare_modes_switch_by_click_and_by_key, a_film_shows_its_lanes_on_one_clock, a_flaky_picture_is_shown_and_marked, a_look_that_arrives_shows_without_a_reload, a_look_shows_only_once_its_pictures_have_arrived, pictures_group_by_the_parts_of_their_names, and the ignored pictures, which writes page pictures to ee/target/tmp)
      - ee/app/src/pictures.test.ts (name parts, order, grouping, counts, live looks, film lanes and outlines)
    status: done
  - id: verdicts-and-check
    tests:
      - crates/fearlezz-proof/tests/review.rs (where review of a head stands, content keys of stills and films, carry over, accept, cancel, summary)
      - crates/fearlezz/tests/host.rs (a_weakening_waits_for_an_admin_when_the_host_took_the_run, a_weakening_fails_the_proof_when_the_host_did_not_take_the_run)
      - ee/host-tests/tests/host.rs (a_verdict_needs_a_session_write_access_the_app_origin_and_json, a_bearer_token_never_gives_a_verdict_or_an_accept, a_verdict_on_a_local_run_is_refused, a_verdict_carries_over_to_a_later_run_with_the_same_pictures, a_film_verdict_follows_its_changed_states, accept_needs_an_admin, the_check_run_follows_the_review_through_a_whole_flow, one_comment_is_created_then_edited, a_webhook_with_a_wrong_signature_is_refused, a_job_that_ends_without_done_cancels_its_run, a_queued_job_shows_as_waiting_for_a_runner, a_verdict_given_in_one_tab_shows_in_another, the_page_says_what_each_person_can_do, and the review shots of the ignored pictures)
      - ee/app/src/review.test.ts, ee/app/src/live.test.ts (verdicts, carry over and what waits, as the page words them)
    status: done
  - id: notes
    tests:
      - crates/fearlezz-proof/tests/review.rs (a_picture_that_needs_change_fails_the_review_and_the_summary_lists_the_notes, a_needs_change_verdict_holds_only_for_the_content_it_was_given_on)
      - crates/fearlezz/tests/notes.rs (login_keeps_a_token_only_the_user_can_read_and_logout_removes_it, status_shows_what_waits_on_the_host_and_leads_to_the_notes, without_a_sign_in_status_asks_nothing_of_the_host, a_host_that_cannot_be_reached_is_one_line_and_status_goes_on, notes_saves_each_notes_pictures_with_its_region_drawn, notes_without_a_sign_in_leads_to_login, open_notes_hold_the_agent_from_stopping_once)
      - ee/host-tests/tests/host/notes.rs (a_note_needs_a_session_write_access_and_a_picture_of_the_run, needs_change_needs_an_open_note_and_fails_the_check_run, an_open_note_follows_the_work_until_a_writer_resolves_it, a_cli_token_reads_but_never_writes, the_cli_signs_in_through_the_host_with_githubs_device_flow, the_cli_reads_open_notes_with_their_pictures, a_note_drawn_on_the_page_is_saved_and_shows_in_another_tab, a_film_note_takes_the_moment_of_the_film_clock, an_old_note_shows_dashed_with_its_run_on_a_later_run, and the note shots of the ignored pictures)
      - ee/app/src/notes.test.ts, ee/app/src/review.test.ts (numbering, old notes, regions, sides, needs change as the page words it)
    status: done
  - id: local-runs
    tests:
      - crates/fearlezz/tests/local.rs (a_signed_in_run_opens_a_local_run_before_its_checks_and_streams_them, without_a_sign_in_a_run_sends_nothing, a_repository_without_the_app_sends_no_run, a_host_that_fails_never_fails_the_run_and_is_given_up_at_once, a_host_that_hangs_costs_the_run_one_short_wait)
      - ee/host-tests/tests/host/local.rs (a_cli_token_opens_a_local_run_only_with_write_access, a_local_run_takes_notes_but_never_a_verdict_or_an_accept, a_local_run_never_touches_the_check_run_or_the_comment, a_note_on_a_local_run_shows_on_a_later_ci_run_of_the_work, a_silent_local_run_is_cancelled_after_an_hour, the_host_renews_an_expired_github_token, a_cli_token_unused_for_30_days_is_refused, the_page_marks_a_local_run_unproven_and_offers_only_notes, and the local shots of the ignored pictures)
      - ee/app/src/review.test.ts (who ran a local run)
    status: done
  - id: finish
    tests:
      - ee/host-tests/tests/host/share.rs (a_share_link_shows_the_live_work_and_follows_a_new_run, a_share_link_never_writes, a_revoked_share_link_is_not_found_and_names_no_repository, a_writer_makes_lists_and_revokes_share_links_and_a_reader_cannot, and the share shots of the ignored pictures)
      - ee/host-tests/tests/host/repository.rs (the_repository_page_lists_its_works_with_what_waits, a_private_repository_page_needs_a_reader, the_repository_page_updates_live, and the repository shots of the ignored pictures)
      - ee/host-tests/tests/host/local.rs (a_local_run_uploading_its_files_is_not_silent)
      - ee/app/src/repository.test.ts (the listing, where the page is, the grant through a link, view only)
    status: done
    taught: >-
      Worker wasm 482 KB gzip before, 410 KB with opt-level "z" and wasm-opt -Oz; the rest is the
      host's own code and serde's code for the proof model, not settings. Share tokens are kept
      as their HMAC, so a link is shown once and the list names who made it and when.

