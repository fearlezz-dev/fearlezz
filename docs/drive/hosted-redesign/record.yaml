# docs/drive/hosted-redesign/record.yaml: the working state of the hosted redesign.
goal: >-
  Rethink what is free and what is hosted. The hosted version should be more hosted: a live page
  the host renders itself (waiting, loading, done) instead of a static page CI generates, where a
  person can say "no, this doesn't look right yet", annotate the old side, the new side or both,
  and the agent gets that feedback through Fearlezz commands, with the images.

pieces:
  - id: split
    status: figuring-out
    open: Per piece split is in inventory.html; free-ci-only-proves picked the direction.
    tries:
      - id: free-only-proves
        what: Free CI only proves; all approval machinery leaves the core.
        state: picked
        why: Chosen by the developer (option A of inventory.html).
        evidence: [docs/drive/hosted-redesign/inventory.html]
  - id: live-page
    status: figuring-out
    open: Can workers-rs do Durable Objects with hibernating WebSockets, and serve a Solid page?
    tries:
      - id: spike-live
        what: Throwaway Rust worker with a DO per PR, events in, live Solid page, under wrangler dev.
        state: trying
        evidence: []
  - id: authority
    status: figuring-out
    open: Where an approval lives and who sets the GitHub status in hosted mode.
    tries: []
  - id: feedback
    status: figuring-out
    open: Note model drafted in model.md; how the agent reads it (fearlezz --notes) not yet shown.
    tries:
      - id: mockup-1
        what: Live page mockup with region notes on before, after or both, and a verdict per picture.
        state: working
        evidence: [docs/drive/hosted-redesign/mockup.html, docs/drive/hosted-redesign/model.md]
  - id: ui-stack
    status: figuring-out
    open: Default is TypeScript with Solid in ee/, types generated from fearlezz-proof; not yet confirmed.
    tries: []

decided:
  - id: redo-is-fine
    what: "Be critical and thorough, because we want to make this the best, not the easiest. If we have to redo quite a bit, that's fine."
  - id: free-may-shrink
    what: "We'll limit the free version maybe a bit more, but the hosted version should be more hosted."
  - id: not-ci-generated
    what: The web page should not be generated by CI; it should be dynamically updated and show waiting, loading and done.
  - id: feedback-loop
    what: >-
      A person can say "no, this doesn't look right yet", annotate on the new side, the old side
      or both, and the agent retrieves it with Fearlezz commands, with the images.

  - id: free-ci-only-proves
    what: >-
      Free CI only proves. Changed pictures are listed but do not block; a weakening fails until an
      admin bypasses it; the human gate is GitHub's normal PR review. All approval machinery
      leaves the core. Hosted adds the live page, approvals and notes.
  - id: host-is-authority
    what: >-
      Follows from free-ci-only-proves: with no comment parser left in the core, a hosted approval
      lives on the host, which sets the GitHub check run as the app. Supersedes "approve posts the
      comment as the person" in docs/drive/hosted-proof.md.

  - id: only-host-has-a-page
    what: >-
      Only the host has a page (option 3). The local look page (report.rs) goes; free users get
      text and picture files, not a visual compare page.

  - id: local-runs-on-host
    what: >-
      Local runs show on the host, marked unproven, so feedback works before a PR exists. The
      developer signs in once; a local run is never approvable; notes carry over to the PR.
  - id: verdict-per-picture
    what: >-
      Approving is per picture: Looks right or Needs change. Words only on Needs change notes.
      Replaces the approval per check in the person's own words.

open:
  - id: overview-page
    ask: The local overview page (overview.rs, fearlezz --all) also goes, by only-host-has-a-page? (stated as default, no objection yet)

slices: []

next: Wait for spike-live; then sketch fearlezz --notes and the events protocol. Earlier: inventory shown (docs/drive/hosted-redesign/inventory.html). Waiting on free-approvals; then authority, live transport spike, UI stack.
