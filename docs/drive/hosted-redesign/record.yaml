# docs/drive/hosted-redesign/record.yaml: the working state of the hosted redesign.
goal: >-
  Rethink what is free and what is hosted. The hosted version should be more hosted: a live page
  the host renders itself (waiting, loading, done) instead of a static page CI generates, where a
  person can say "no, this doesn't look right yet", annotate the old side, the new side or both,
  and the agent gets that feedback through Fearlezz commands, with the images.

pieces:
  - id: split
    status: figuring-out
    open: Per piece split is in inventory.html; free-ci-only-proves picked the direction.
    tries:
      - id: free-only-proves
        what: Free CI only proves; all approval machinery leaves the core.
        state: picked
        why: Chosen by the developer (option A of inventory.html).
        evidence: [docs/drive/hosted-redesign/inventory.html]
  - id: live-page
    status: figuring-out
    open: Protocol version 2, the live page and its pictures are built; verdicts come next.
    tries:
      - id: spike-live
        what: Throwaway Rust worker with a DO per PR, events in, live Solid page, under wrangler dev.
        taught: >-
          workers-rs 0.9.0 (ours, newest) supports DO WebSocket hibernation with no workaround;
          the object was evicted after 90 s idle with the socket kept and its attachment intact.
          Two clients got events in order, a late client got the current state first. Worker wasm
          87 KB gzip, Solid page 5.9 KB gzip, POST to receive 4 ms median locally. Snags: assets
          fallback needs Sec-Fetch-Mode navigate, tsc needs skipLibCheck, wrangler dev shows no
          hibernation indicator.
        state: picked
        why: Rust Durable Object with hibernation works; no JS object or polling needed.
        evidence: [spike deleted after recording; numbers above]
  - id: authority
    status: figuring-out
    open: Where an approval lives and who sets the GitHub status in hosted mode.
    tries: []
  - id: feedback
    status: figuring-out
    open: Note model drafted in model.md; how the agent reads it (fearlezz --notes) not yet shown.
    tries:
      - id: mockup-1
        what: Live page mockup with region notes on before, after or both, and a verdict per picture.
        state: working
        evidence: [docs/drive/hosted-redesign/mockup.html, docs/drive/hosted-redesign/model.md]
  - id: ui-stack
    status: done
    open: Picked, see decided stack.
    tries: []

decided:
  - id: redo-is-fine
    what: "Be critical and thorough, because we want to make this the best, not the easiest. If we have to redo quite a bit, that's fine."
  - id: free-may-shrink
    what: "We'll limit the free version maybe a bit more, but the hosted version should be more hosted."
  - id: not-ci-generated
    what: The web page should not be generated by CI; it should be dynamically updated and show waiting, loading and done.
  - id: feedback-loop
    what: >-
      A person can say "no, this doesn't look right yet", annotate on the new side, the old side
      or both, and the agent retrieves it with Fearlezz commands, with the images.

  - id: free-ci-only-proves
    what: >-
      Free CI only proves. Changed pictures are listed but do not block; a weakening fails until an
      admin bypasses it; the human gate is GitHub's normal PR review. All approval machinery
      leaves the core. Hosted adds the live page, approvals and notes.
  - id: host-is-authority
    what: >-
      Follows from free-ci-only-proves: with no comment parser left in the core, a hosted approval
      lives on the host, which sets the GitHub check run as the app. Supersedes "approve posts the
      comment as the person" in docs/drive/hosted-proof.md.

  - id: only-host-has-a-page
    what: >-
      Only the host has a page (option 3). The local look page (report.rs) goes; free users get
      text and picture files, not a visual compare page.

  - id: local-runs-on-host
    what: >-
      Local runs show on the host, marked unproven, so feedback works before a PR exists. The
      developer signs in once; a local run is never approvable; notes carry over to the PR.
  - id: verdict-per-picture
    what: >-
      Approving is per picture: Looks right or Needs change. Words only on Needs change notes.
      Replaces the approval per check in the person's own words.
  - id: no-overview-page
    what: >-
      The local overview page goes too; fearlezz --all prints text. The host's repository page
      lists all work live.

  - id: stack
    what: >-
      Rust worker with one Durable Object per piece of work for live updates; the page in
      TypeScript with Solid, built by Vite, served by the same worker; TypeScript types generated
      from fearlezz-proof. The page lives only in ee/; the core gets no JS build.

  - id: verdict-follows-picture
    what: >-
      A verdict follows the picture: keyed by check, picture and content (films by which states
      changed), so an unchanged picture keeps its verdict across pushes.

  - id: one-pr
    what: All slices on one branch, one pull request; hosted never breaks on main.
  - id: no-local-approval
    what: >-
      The local approval (fearlezz say approve --said and --github) goes too. The final stage says
      pictures changed and a person reviews them on the pull request; it does not wait.

open:
  - id: look-before-its-files
    ask: >-
      A finished event carries the look before CI has sent the pictures the host lacks (the
      host answers missing, then CI sends them), so a page open at that moment asks for a
      picture the host does not hold yet, gets 404 and shows it broken until reload. Seen as a
      flake of a_look_that_arrives_shows_without_a_reload. Remove the cause on the host (send the
      look live only once every file it names is held, from the blob upload that completes it),
      or let the page wait for and retry a picture that is not there yet? Not settled.
  - id: base-shell
    ask: >-
      A check's shell still comes from the change's [env] on the base checkout (same class as the
      prepare fix f5d16d9). Fix it too? Raise at the next check-in.

slices:
  - id: core-cut
    tests:
      - crates/fearlezz/tests/ci.rs (on_a_pull_request_ci_proves_and_writes_nothing_to_github, a_weakening_fails_a_pull_request_and_writes_nothing_to_github, changed_pictures_are_listed_and_neither_block_nor_wait)
      - crates/fearlezz/tests/look.rs (run_compares_stills_with_the_base_and_names_their_files, the_final_stage_is_ready_with_changed_pictures_and_names_them, say_approve_is_gone)
      - crates/fearlezz/tests/core.rs (the_overview_of_every_journal_is_text_and_writes_no_page, a_journal_from_before_approvals_were_removed_still_reads)
    status: built
  - id: host-v2-foundation
    tests:
      - crates/fearlezz/tests/host.rs (the_run_streams_to_the_host_while_its_checks_run, a_finished_check_sends_its_entry_and_output_and_only_missing_blobs, done_sends_the_files_the_host_still_lacks_and_closes_again, the_log_and_the_summary_link_the_hosts_page, the_token_is_asked_for_the_hosts_origin, nothing_leaves_ci_when_the_app_is_not_installed, without_the_id_token_permission_nothing_is_asked, a_host_that_fails_never_fails_the_proof, every_call_to_the_host_asks_for_a_fresh_token)
      - ee/host-tests/tests/host.rs (a_run_opens_and_answers_the_page_of_its_work, checks_stream_into_the_run, a_finished_check_asks_only_for_the_files_the_repository_lacks, done_is_refused_while_a_file_is_missing, a_run_takes_calls_only_from_its_own_repository_and_ref, a_closed_run_takes_nothing_more, a_run_for_another_pull_request_is_refused, a_run_for_another_branch_is_refused, the_work_page_is_served_for_a_navigation, an_unknown_work_is_not_found, the_files_origin_refuses_a_grant_for_another_run, a_page_shows_a_check_move_from_running_to_passed_live, a_page_opened_mid_run_shows_the_current_state, two_pages_both_update, and the kept sign in, access, OIDC and files tests)
      - ee/host-tests/tests/types.rs (the_pages_types_are_the_proof_model)
      - ee/app/src/live.test.ts (how a snapshot and events become the page's state)
    status: done
  - id: pictures-on-page
    tests:
      - crates/fearlezz/tests/host.rs (a_finished_check_sends_its_look_with_the_pictures)
      - ee/host-tests/tests/host.rs (a_finished_check_brings_its_look_to_the_page, a_look_of_another_check_is_refused, the_files_origin_serves_only_pictures_and_films, the_page_gets_a_grant_for_the_files_of_a_run_it_shows, the_work_page_is_served_for_a_navigation (CSP), the_page_shows_a_changed_picture_with_its_before_and_after, the_compare_modes_switch_by_click_and_by_key, a_film_shows_its_lanes_on_one_clock, a_flaky_picture_is_shown_and_marked, a_look_that_arrives_shows_without_a_reload, pictures_group_by_the_parts_of_their_names, and the ignored pictures, which writes page pictures to ee/target/tmp)
      - ee/app/src/pictures.test.ts (name parts, order, grouping, counts, live looks, film lanes and outlines)
    status: done
  - id: verdicts-and-check
    tests: []
    status: todo
  - id: notes
    tests: []
    status: todo
  - id: local-runs
    tests: []
    status: todo
  - id: finish
    tests: []
    status: todo

