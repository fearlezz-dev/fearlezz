<style>
.fz{--ok:var(--success,#1E7A52);--bad:var(--destructive,#B53A26);--run:var(--info,#2D55C8);--wait:var(--warning,#A86410);--line:var(--border,#D5DBE4);--card:var(--card,#fff);--soft:var(--muted-foreground,#5A6577);--sub:var(--secondary,#EEF1F5);
  font:14px/1.5 var(--font-sans,system-ui);color:var(--foreground,#18212E)}
.fz *{box-sizing:border-box}
.fz .repo{color:var(--soft);font-size:.85rem}
.fz h1{font-size:1.5rem;margin:2px 0 10px;letter-spacing:-.01em}
.fz .state{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:600;padding:12px 14px;border-radius:var(--radius,10px);background:color-mix(in srgb,var(--wait) 13%,transparent);color:var(--wait)}
.fz .state.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.fz .state.run{background:color-mix(in srgb,var(--run) 12%,transparent);color:var(--run)}
.fz .state small{font-weight:400;color:var(--soft);margin-left:auto;font-size:.82rem}
.fz .cols{display:grid;grid-template-columns:230px 1fr;gap:14px;margin-top:14px}
@media (max-width:640px){.fz .cols{grid-template-columns:1fr}}
.fz .box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius,10px);padding:12px}
.fz h2{font-size:.95rem;margin:0 0 8px}
.fz .runs button{all:unset;display:block;width:100%;padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px}
.fz .runs button[aria-pressed=true]{background:var(--sub)}
.fz .runs button:focus-visible,.fz button:focus-visible,.fz input:focus-visible{outline:2px solid var(--run);outline-offset:2px}
.fz .runs b{display:block;font-weight:600}
.fz .runs span{font-size:.8rem;color:var(--soft)}
.fz .pill{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:99px;margin-left:4px;vertical-align:1px}
.fz .p-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.fz .p-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.fz .p-run{color:var(--run);background:color-mix(in srgb,var(--run) 14%,transparent)}
.fz .p-wait{color:var(--wait);background:color-mix(in srgb,var(--wait) 16%,transparent)}
.fz .p-un{color:var(--soft);background:var(--sub)}
.fz .checks{list-style:none;margin:10px 0 0;padding:0;font-size:.85rem}
.fz .checks li{display:flex;justify-content:space-between;padding:3px 0}
.fz .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;background:var(--line)}
.fz .dot.ok{background:var(--ok)}.fz .dot.bad{background:var(--bad)}.fz .dot.run{background:var(--run)}
@media (prefers-reduced-motion:no-preference){.fz .dot.run{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}}
.fz .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fz .tabs button,.fz .btn{font:inherit;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:8px;padding:5px 10px;cursor:pointer}
.fz .tabs button[aria-pressed=true]{background:var(--foreground,#18212E);color:var(--background,#fff);border-color:transparent}
.fz .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fz .side{font-size:.78rem;color:var(--soft);margin-bottom:4px;display:flex;justify-content:space-between}
.fz .shot{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:crosshair;touch-action:none;user-select:none}
.fz .shot svg{display:block;width:100%;height:auto}
.fz .reg{position:absolute;border:2px solid var(--bad);border-radius:4px;background:color-mix(in srgb,var(--bad) 8%,transparent);pointer-events:none}
.fz .reg.old{border-style:dashed;border-color:var(--wait);background:transparent}
.fz .reg i{position:absolute;top:-10px;left:-10px;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;font:600 11px/18px var(--font-sans,system-ui);text-align:center;font-style:normal}
.fz .reg.old i{background:var(--wait)}
.fz .compose{display:none;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.fz .compose.on{display:flex}
.fz .compose input[type=text]{flex:1;min-width:160px;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit}
.fz label{font-size:.82rem;color:var(--soft);display:flex;gap:5px;align-items:center}
.fz .notes{list-style:none;margin:12px 0 0;padding:0}
.fz .notes li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.fz .notes .n{width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font:600 11px/20px var(--font-sans,system-ui);text-align:center}
.fz .notes .n.old{background:var(--wait)}
.fz .notes small{color:var(--soft);display:block}
.fz .verdict{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fz .btn.ok{border-color:var(--ok);color:var(--ok)}
.fz .btn.bad{border-color:var(--bad);color:var(--bad)}
.fz .hint{font-size:.8rem;color:var(--soft);margin:8px 0 0}
</style>
<div class="fz">
  <div class="repo">fearlezz-dev/fearlezz, pull request #24</div>
  <h1>Fix the card button on narrow screens</h1>
  <div class="state run" id="state">CI is proving 87c65fe<small id="stateSmall">live</small></div>

  <div class="cols">
    <div class="box runs">
      <h2>Runs</h2>
      <button aria-pressed="true"><b>CI, Linux <span class="pill p-run" id="ciPill">running</span></b><span>87c65fe, started 2 min ago</span>
        <ul class="checks" id="checks"></ul></button>
      <button aria-pressed="false"><b>CI, macOS <span class="pill p-wait">queued</span></b><span>waiting for a runner</span></button>
      <button aria-pressed="false"><b>Local run <span class="pill p-un">unproven</span></b><span>the agent, 40 min ago, 3f1a0c2</span></button>
    </div>

    <div class="box">
      <h2>Does it look right to you?</h2>
      <div class="tabs" role="group" aria-label="Pictures">
        <button aria-pressed="true">card / dark</button>
        <button aria-pressed="false">card / light</button>
        <button aria-pressed="false">checkout film</button>
      </div>
      <div class="pair">
        <div><div class="side"><span>before, main</span></div><div class="shot" data-side="before" id="before"></div></div>
        <div><div class="side"><span>after, 87c65fe</span></div><div class="shot" data-side="after" id="after"></div></div>
      </div>
      <p class="hint">Drag on either picture to mark what is wrong.</p>
      <div class="compose" id="compose">
        <input type="text" id="words" placeholder="What should change here?" aria-label="Note">
        <label><input type="checkbox" id="both"> on both sides</label>
        <button class="btn" id="add">Add note</button>
      </div>
      <ul class="notes" id="notes"></ul>
      <div class="verdict">
        <button class="btn bad" id="needs">Needs change</button>
        <button class="btn ok" id="right">Looks right</button>
      </div>
    </div>
  </div>
</div>
<script>
(()=>{
const card=(btnW,label,avatarX)=>`<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<rect width="320" height="200" fill="#1d2430"/><rect x="20" y="20" width="280" height="160" rx="14" fill="#283141"/>
<circle cx="${avatarX}" cy="52" r="14" fill="#5b6b86"/><rect x="${avatarX+24}" y="42" width="120" height="10" rx="4" fill="#cfd6e2"/>
<rect x="${avatarX+24}" y="58" width="80" height="8" rx="4" fill="#7b879b"/>
<rect x="40" y="86" width="230" height="8" rx="4" fill="#56627a"/><rect x="40" y="102" width="200" height="8" rx="4" fill="#56627a"/>
<svg x="40" y="132" width="${btnW}" height="30"><rect width="110" height="30" rx="8" fill="#3fb37f"/>
<text x="16" y="20" font-family="system-ui" font-size="13" font-weight="600" fill="#08281a">${label}</text></svg></svg>`;
const $=id=>document.getElementById(id);
$('before').innerHTML=card(110,'Continue',54);
$('after').innerHTML=card(66,'Continue',62);

// a note carried over from the local run
const notes=[{n:1,side:'after',r:{x:.1,y:.63,w:.3,h:.2},words:'The button text is cut off.',by:'gabber235',old:true}];
let draft=null,drawing=null;

function paint(){
  for(const el of document.querySelectorAll('.fz .reg'))el.remove();
  const all=[...notes];if(draft)all.push({...draft,n:notes.length+1,draft:true});
  for(const note of all){
    const sides=note.side==='both'?['before','after']:[note.side];
    for(const s of sides){
      const d=document.createElement('div');d.className='reg'+(note.old?' old':'');
      Object.assign(d.style,{left:note.r.x*100+'%',top:note.r.y*100+'%',width:note.r.w*100+'%',height:note.r.h*100+'%'});
      d.innerHTML=`<i>${note.n}</i>`;$(s).appendChild(d);
    }
  }
  $('notes').innerHTML=notes.map(n=>`<li><span class="n${n.old?' old':''}">${n.n}</span><div>${n.words.replace(/</g,'&lt;')}<small>${n.by}, ${n.side==='both'?'both sides':n.side}${n.old?', from the local run 40 min ago':', just now'}</small></div></li>`).join('');
}
for(const shot of [$('before'),$('after')]){
  shot.addEventListener('pointerdown',e=>{
    const b=shot.getBoundingClientRect();shot.setPointerCapture(e.pointerId);
    drawing={side:shot.dataset.side,b,x0:(e.clientX-b.left)/b.width,y0:(e.clientY-b.top)/b.height};
  });
  shot.addEventListener('pointermove',e=>{
    if(!drawing)return;const {b,x0,y0}=drawing;
    const x1=Math.min(Math.max((e.clientX-b.left)/b.width,0),1),y1=Math.min(Math.max((e.clientY-b.top)/b.height,0),1);
    draft={side:$('both').checked?'both':drawing.side,r:{x:Math.min(x0,x1),y:Math.min(y0,y1),w:Math.abs(x1-x0),h:Math.abs(y1-y0)}};paint();
  });
  shot.addEventListener('pointerup',()=>{if(!drawing)return;drawing=null;
    if(draft&&draft.r.w>.02&&draft.r.h>.02){$('compose').classList.add('on');$('words').focus();}else{draft=null;paint();}});
}
$('both').addEventListener('change',()=>{if(draft&&draft.side!=='both'){draft._s=draft.side;}if(draft){draft.side=$('both').checked?'both':(draft._s||'after');paint();}});
$('add').addEventListener('click',()=>{if(!draft||!$('words').value.trim())return;
  notes.push({n:notes.length+1,side:draft.side,r:draft.r,words:$('words').value.trim(),by:'you'});
  draft=null;$('words').value='';$('both').checked=false;$('compose').classList.remove('on');paint();});
$('words').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click();});
$('needs').addEventListener('click',()=>{setState('bad',`Sent to the agent: ${notes.length} note${notes.length===1?'':'s'} on card / dark`,'the agent reads them with fearlezz');});
$('right').addEventListener('click',()=>{setState('ok','card / dark looks right','2 pictures still wait');});
function setState(kind,text,small){const s=$('state');s.className='state'+(kind==='ok'?' ok':kind==='run'?' run':'');s.firstChild.textContent=text;$('stateSmall').textContent=small;}

// live CI run
const checks=['fmt','clippy','tests','settings','rules','safety','demo-card'].map(id=>({id,s:'wait'}));
function drawChecks(){$('checks').innerHTML=checks.map(c=>`<li><span><span class="dot ${c.s==='wait'?'':c.s}"></span>${c.id}</span><span>${c.s==='run'?'running':c.s==='ok'?'passed':c.s==='bad'?'failed':''}</span></li>`).join('');}
let i=0;
function tick(){
  if(i<checks.length){checks[i].s='run';if(i>0)checks[i-1].s='ok';drawChecks();i++;setTimeout(tick,1100);}
  else{checks[i-1].s='ok';drawChecks();$('ciPill').className='pill p-wait';$('ciPill').textContent='needs you';
    setState('wait','Needs you: 3 changed pictures','proven at 87c65fe');}
}
drawChecks();paint();setTimeout(tick,700);
})();
</script>
