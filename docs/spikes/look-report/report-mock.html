<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Look report mock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* A light table: pictures on mats, one colour per kind of change, the same colour in
   the counts, the words, the outlines and the timeline marks. */
:root {
  --surface:#eef0f3; --mat:#ffffff; --ink:#14171c; --quiet:#5f6672; --rule:#d5d9df;
  --changed:#c8106f; --timing:#a45a06; --new:#1f5fd1; --gone:#5f6672; --same:#2f7d4f;
  --ok:#2f7d4f; --focus:#1f5fd1; --soft:#e3e6eb;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface:#15181d; --mat:#0c0e11; --ink:#eceef2; --quiet:#9aa1ad; --rule:#2a2f37;
    --changed:#ff4fa6; --timing:#f5a524; --new:#7aa7ff; --gone:#9aa1ad; --same:#5fd08f;
    --ok:#5fd08f; --focus:#7aa7ff; --soft:#20242b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface:#15181d; --mat:#0c0e11; --ink:#eceef2; --quiet:#9aa1ad; --rule:#2a2f37;
  --changed:#ff4fa6; --timing:#f5a524; --new:#7aa7ff; --gone:#9aa1ad; --same:#5fd08f;
  --ok:#5fd08f; --focus:#7aa7ff; --soft:#20242b; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink);
  font: 18px/1.6 "Atkinson Hyperlegible", system-ui, sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 40px 16px 220px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1 { font-size: 40px; line-height: 1.1; margin: 0 0 8px; }
.sub { color: var(--quiet); margin: 0 0 32px; }

/* Counts: each is a filter. */
.counts { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 20px; padding: 0; list-style: none; }
.count { min-width: 112px; padding: 12px 18px; border-radius: 12px; background: var(--mat);
  border: 2px solid transparent; text-align: left; }
.count b { display: block; font-size: 34px; line-height: 1.1; }
.count span { color: var(--quiet); }
.count[aria-pressed="true"] { border-color: currentColor; }
.count.changed b { color: var(--changed); } .count.timing b { color: var(--timing); }
.count.new b { color: var(--new); } .count.gone b { color: var(--gone); } .count.same b { color: var(--same); }
.count.zero { opacity: .55; }
.took { align-self: center; color: var(--quiet); margin-left: 4px; }

.bar { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; margin: 0 0 40px; }
.seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; }
.seg button[aria-pressed="true"] { background: var(--mat); font-weight: 700; }
.label { color: var(--quiet); margin-right: 8px; }

.hint { background: var(--mat); border-left: 5px solid var(--changed); border-radius: 0 12px 12px 0;
  padding: 14px 18px; margin: 0 0 40px; max-width: 760px; }
.hint p { margin: 0; }

h2.group { font-size: 22px; margin: 48px 0 16px; color: var(--quiet); font-weight: 400; }
h2.group b { color: var(--ink); }

article { background: var(--mat); border-radius: 16px; padding: 24px; margin: 0 0 28px; }
article.decided-ok { box-shadow: inset 6px 0 0 var(--ok); }
article.decided-no { box-shadow: inset 6px 0 0 var(--changed); }
article.flaky { opacity: .62; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 0 0 6px; }
.head h3 { margin: 0; font-size: 24px; }
.tags { display: flex; gap: 6px; }
.tag { background: var(--soft); border-radius: 6px; padding: 0 8px; font-size: 15px; color: var(--quiet); }
.word { font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 2px solid currentColor; font-size: 15px; }
.word.changed { color: var(--changed); } .word.timing { color: var(--timing); }
.word.new { color: var(--new); } .word.gone { color: var(--gone); } .word.same { color: var(--same); }
.word.flaky { color: var(--quiet); border-style: dashed; }
.what { margin: 0 0 18px; color: var(--quiet); }

.modes { margin: 0 0 14px; }
.stage { position: relative; display: grid; gap: 16px; }
.stage.two { grid-template-columns: 1fr 1fr; }
.stage figure { margin: 0; min-width: 0; }
.stage figcaption { font-weight: 700; margin: 0 0 6px; }
.frame { position: relative; line-height: 0; background: var(--surface); border-radius: 8px; overflow: hidden;
  border: 1px solid var(--rule); max-height: 620px; }
.frame img, .frame video, .frame canvas { width: 100%; height: auto; max-height: 620px; object-fit: contain; display: block; }
.mark { position: absolute; outline: 3px solid var(--changed); outline-offset: 2px; border-radius: 3px; pointer-events: none; }
.over { position: absolute; inset: 0; }
.over img { width: 100%; height: 100%; object-fit: contain; }
.slider { position: absolute; inset: 0; overflow: hidden; }
.handle { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--changed); pointer-events: none; }
input[type=range] { width: 100%; accent-color: var(--changed); margin: 12px 0 0; }
.single { max-width: 720px; }
.phone .single, .phone.stage.two { max-width: 640px; }

.decide { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 20px 0 0; }
.decide button { border: 2px solid var(--rule); background: none; border-radius: 10px; padding: 8px 16px; }
.decide .yes[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); font-weight: 700; }
.decide .no[aria-pressed="true"] { border-color: var(--changed); color: var(--changed); font-weight: 700; }
.decide .flake { margin-left: auto; color: var(--quiet); border-style: dashed; }
.decide .flake[aria-pressed="true"] { color: var(--ink); }
.note { flex-basis: 100%; }
.note textarea { width: 100%; max-width: 640px; font: inherit; padding: 8px 12px; border-radius: 10px;
  border: 2px solid var(--rule); background: var(--surface); color: var(--ink); }

/* Film: a shared clock for both films, and a timeline that shows where they differ. */
.timeline { position: relative; height: 64px; margin: 18px 0 4px; user-select: none; touch-action: none; cursor: pointer; }
.lane { position: absolute; left: 0; right: 0; height: 22px; border-radius: 6px; background: var(--soft); overflow: hidden; }
.lane.b { top: 4px; } .lane.a { top: 34px; }
.lane i { position: absolute; top: 0; bottom: 0; border-right: 2px solid var(--mat); }
.lane i.diff { background: var(--changed); opacity: .85; }
.lane i.ok { background: var(--rule); }
.lane em { position: absolute; left: 8px; top: 0; font-style: normal; font-size: 13px; line-height: 22px; color: var(--ink); mix-blend-mode: normal; }
.playhead { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--ink); border-radius: 2px; }
.clock { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.clock .t { font-variant-numeric: tabular-nums; min-width: 9ch; }
.clock button { border: 2px solid var(--rule); background: none; border-radius: 10px; padding: 6px 14px; }
.legend { color: var(--quiet); font-size: 15px; display: flex; gap: 18px; flex-wrap: wrap; margin: 6px 0 0; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }

/* Approve: always in reach at the bottom. */
.dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--mat); border-top: 1px solid var(--rule);
  box-shadow: 0 -8px 24px rgba(20, 23, 28, .08); }
.dock-in { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 10px;
  grid-template-columns: auto 1fr auto; align-items: center; }
.progress { font-weight: 700; white-space: nowrap; }
.progress small { display: block; font-weight: 400; color: var(--quiet); }
.said { display: flex; gap: 10px; align-items: center; min-width: 0; }
.said input { flex: 1; min-width: 0; font: inherit; padding: 8px 12px; border-radius: 10px;
  border: 2px solid var(--rule); background: var(--surface); color: var(--ink); }
.cmd { grid-column: 1 / -1; font: 14px/1.4 ui-monospace, "SF Mono", Menlo, monospace; color: var(--quiet);
  overflow-x: auto; white-space: nowrap; }
.go { display: flex; gap: 8px; }
.go button { border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 700; background: var(--ok); color: #fff; }
.go button.second { background: var(--soft); color: var(--ink); }
.dock.blocked .go button.primary { background: var(--changed); }
.keys { color: var(--quiet); font-size: 15px; margin: 40px 0 0; }
kbd { font: 14px ui-monospace, Menlo, monospace; border: 1px solid var(--rule); border-bottom-width: 2px;
  border-radius: 5px; padding: 0 6px; background: var(--mat); }
.mock { color: var(--quiet); font-size: 15px; border: 2px dashed var(--rule); border-radius: 12px; padding: 10px 14px; margin: 0 0 32px; max-width: 760px; }

@media (max-width: 760px) {
  h1 { font-size: 30px; }
  .stage.two { grid-template-columns: 1fr; }
  .dock-in { grid-template-columns: 1fr; }
  .decide .flake { margin-left: 0; }
  article { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<main>
  <p class="mock">Design mock built from a real run. Grouping, flaky marks and per picture decisions are proposals; the page cannot run commands, so it copies them.</p>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <ul class="counts" id="counts"></ul>
  <div class="bar">
    <div><span class="label">Group by</span><span class="seg" id="group"></span></div>
    <div><span class="label">Theme</span><span class="seg" id="theme"></span></div>
  </div>
  <div class="hint" id="hint" hidden></div>
  <div id="list"></div>
  <p class="keys"><kbd>j</kbd> <kbd>k</kbd> next and back &nbsp; <kbd>1</kbd> to <kbd>5</kbd> view &nbsp; <kbd>y</kbd> looks right &nbsp; <kbd>n</kbd> not right</p>
</main>

<div class="dock" id="dock">
  <div class="dock-in">
    <div class="progress" id="progress"></div>
    <label class="said"><span>In your words</span><input id="said" value="looks good" autocomplete="off"></label>
    <div class="go"><button class="primary" id="copy"></button><button class="second" id="copy2"></button></div>
    <div class="cmd" id="cmd"></div>
  </div>
</div>

function needsLook(it) { return it.change !== 'same' && !store.s.flaky[it.name]; }

// ----- header --------------------------------------------------------------------
document.getElementById('title').textContent = 'Look: ' + DATA.check;
document.getElementById('sub').textContent = 'Compared with the base commit ' + DATA.base + '. Took 5.8 s.';

function renderCounts() {
  var box = document.getElementById('counts'); box.textContent = '';
  ['changed', 'new', 'gone', 'timing', 'same'].forEach(function (c) {
    var n = DATA.items.filter(function (i) { return i.change === c; }).length;
    var b = el('button', { class: 'count ' + c + (n ? '' : ' zero'), 'aria-pressed': String(state.filter === c) },
      [el('b', { text: String(n) }), el('span', { text: STATUS[c] })]);
    b.onclick = function () { state.filter = state.filter === c ? null : c; renderAll(); };
    box.appendChild(el('li', {}, [b]));
  });
}

function seg(id, options, current, on) {
  var box = document.getElementById(id); box.textContent = '';
  options.forEach(function (o) {
    var b = el('button', { text: o[1], 'aria-pressed': String(o[0] === current) });
    b.onclick = function () { on(o[0]); };
    box.appendChild(b);
  });
}
function renderBar() {
  seg('group', [['screen', 'Screen'], ['viewport', 'Viewport'], ['theme', 'Theme'], ['change', 'Change']],
    state.group, function (g) { state.group = g; renderAll(); });
  var t = document.documentElement.dataset.theme || 'auto';
  seg('theme', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']], t, function (v) {
    if (v === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
    renderBar();
  });
}

// One change seen in many pictures: say it once.
function renderHint() {
  var hint = document.getElementById('hint');
  var changed = DATA.items.filter(function (i) { return i.change === 'changed' && i.kind === 'still'; });
  var byScreenArea = {};
  changed.forEach(function (i) {
    var m = i.moments[0]; if (!m) return;
    var rel = [m.box[0] / i.size[0], m.box[1] / i.size[1]].map(function (v) { return Math.round(v * 10); }).join(',');
    (byScreenArea[rel] = byScreenArea[rel] || []).push(i.name);
  });
  var biggest = Object.values(byScreenArea).sort(function (a, b) { return b.length - a.length; })[0];
  if (!biggest || biggest.length < 2) { hint.hidden = true; return; }
  hint.hidden = false; hint.textContent = '';
  hint.appendChild(el('p', {}, [el('b', { text: 'Same spot changed in ' + biggest.length + ' pictures. ' }),
    document.createTextNode('Check one closely; the rest likely match.')]));
}

// ----- pictures ------------------------------------------------------------------
function img(src) { return el('img', { src: src, alt: '' }); }
function marks(frame, it, which) {
  if (it.kind !== 'still' || !it.size) return;
  it.moments.forEach(function (m) {
    var b = m.box, w = it.size[0], h = it.size[1];
    frame.appendChild(el('div', { class: 'mark', style: 'left:' + (b[0] / w * 100) + '%;top:' + (b[1] / h * 100) +
      '%;width:' + ((b[2] - b[0]) / w * 100) + '%;height:' + ((b[3] - b[1]) / h * 100) + '%' }));
  });
}
function fig(label, node) { return el('figure', {}, [el('figcaption', { text: label }), node]); }

// Pixels whose gray differs by more than 28, as Fearlezz counts them, in the changed colour.
function diffCanvas(it) {
  var c = el('canvas');
  var a = new Image(), b = new Image(), n = 0;
  var done = function () {
    if (++n < 2) return;
    c.width = a.naturalWidth; c.height = a.naturalHeight;
    var x = c.getContext('2d');
    x.drawImage(b, 0, 0); var pb = x.getImageData(0, 0, c.width, c.height);
    x.drawImage(a, 0, 0); var pa = x.getImageData(0, 0, c.width, c.height);
    var hot = getComputedStyle(document.documentElement).getPropertyValue('--changed').trim();
    var r = parseInt(hot.slice(1, 3), 16), g = parseInt(hot.slice(3, 5), 16), bl = parseInt(hot.slice(5, 7), 16);
    for (var i = 0; i < pa.data.length; i += 4) {
      var ga = .299 * pa.data[i] + .587 * pa.data[i + 1] + .114 * pa.data[i + 2];
      var gb = .299 * pb.data[i] + .587 * pb.data[i + 1] + .114 * pb.data[i + 2];
      if (Math.abs(ga - gb) > 28) { pa.data[i] = r; pa.data[i + 1] = g; pa.data[i + 2] = bl; }
      else { var v = 128 + (ga - 128) * .25; pa.data[i] = pa.data[i + 1] = pa.data[i + 2] = v; }
    }
    x.putImageData(pa, 0, 0);
  };
  a.onload = done; b.onload = done; a.src = it.after; b.src = it.before;
  return c;
}

function stillStage(it, mode) {
  var stage = el('div', { class: 'stage' });
  if (!it.before || !it.after) {
    var only = el('div', { class: 'frame' }, [img(it.after || it.before)]);
    stage.appendChild(el('div', { class: 'single' }, [fig(it.after ? 'After' : 'Before', only)]));
    return stage;
  }
  if (mode === 0) {
    stage.classList.add('two');
    var fb = el('div', { class: 'frame' }, [img(it.before)]); marks(fb, it);
    var fa = el('div', { class: 'frame' }, [img(it.after)]); marks(fa, it);
    stage.appendChild(fig('Before', fb)); stage.appendChild(fig('After', fa));
  } else if (mode === 1 || mode === 2) {
    var frame = el('div', { class: 'frame' }, [img(it.before)]);
    var top = mode === 1 ? el('div', { class: 'slider', style: 'clip-path: inset(0 0 0 50%)' }, [el('div', { class: 'over' }, [img(it.after)])])
                         : el('div', { class: 'over', style: 'opacity:.5' }, [img(it.after)]);
    frame.appendChild(top);
    var handle = mode === 1 ? el('div', { class: 'handle', style: 'left:50%' }) : null;
    if (handle) frame.appendChild(handle);
    var range = el('input', { type: 'range', min: 0, max: 100, value: 50, 'aria-label': mode === 1 ? 'Where before ends' : 'How much after shows' });
    range.oninput = function () {
      if (mode === 1) { top.style.clipPath = 'inset(0 0 0 ' + range.value + '%)'; handle.style.left = range.value + '%'; }
      else top.style.opacity = range.value / 100;
    };
    stage.appendChild(el('div', { class: 'single' }, [fig(mode === 1 ? 'Before on the left, after on the right' : 'Before under after', frame), range]));
  } else if (mode === 3) {
    var fd = el('div', { class: 'frame' }, [diffCanvas(it)]);
    stage.appendChild(el('div', { class: 'single' }, [fig('What differs', fd)]));
  } else {
    var fbk = el('div', { class: 'frame' }, [img(it.after)]);
    var cap = el('figcaption', { text: 'After' });
    var showing = 'after';
    var timer = setInterval(function () {
      if (!document.body.contains(fbk)) { clearInterval(timer); return; }
      showing = showing === 'after' ? 'before' : 'after';
      fbk.firstChild.src = it[showing]; cap.textContent = showing === 'after' ? 'After' : 'Before';
    }, 700);
    stage.appendChild(el('div', { class: 'single' }, [el('figure', {}, [cap, fbk])]));
  }
  return stage;
}

// Two films on one clock, with lanes of their states: grey where they match, the changed
// colour where they differ.
function filmStage(it) {
  var wrap = el('div');
  var vb = el('video', { src: it.before, muted: '', playsinline: '', preload: 'auto' });
  var va = el('video', { src: it.after, muted: '', playsinline: '', preload: 'auto' });
  vb.muted = va.muted = true;
  var stage = el('div', { class: 'stage two' }, [fig('Before', el('div', { class: 'frame' }, [vb])), fig('After', el('div', { class: 'frame' }, [va]))]);
  var total = Math.max(it.total_before || 0, it.total_after || 0) || 1;
  var tl = el('div', { class: 'timeline', role: 'slider', tabindex: '0', 'aria-label': 'Time', 'aria-valuemin': '0', 'aria-valuemax': String(total) });
  var lane = function (cls, label, side) {
    var l = el('div', { class: 'lane ' + cls });
    var seen = {};
    it.pairs.forEach(function (p, k) {
      var idx = p[side]; if (seen[idx] && !p.px) return; seen[idx] = true;
      var start = p[side + '_at'];
      var next = it.pairs.slice(k + 1).find(function (q) { return q[side] !== idx; });
      var end = next ? next[side + '_at'] : (side === 'before' ? it.total_before : it.total_after);
      l.appendChild(el('i', { class: p.px ? 'diff' : 'ok', style: 'left:' + (start / total * 100) + '%;width:' + ((end - start) / total * 100) + '%' }));
    });
    l.appendChild(el('em', { text: label }));
    return l;
  };
  tl.appendChild(lane('b', 'Before', 'before'));
  tl.appendChild(lane('a', 'After', 'after'));
  var head = el('div', { class: 'playhead', style: 'left:0' });
  tl.appendChild(head);
  var t = el('span', { class: 't', text: '0.00 s' });
  var play = el('button', { text: 'Play both' });
  var jumps = it.moments.map(function (m) {
    var b = el('button', { text: 'Go to ' + m.after[0].toFixed(2) + ' s' });
    b.onclick = function () { seek(m.after[0]); };
    return b;
  });
  var seek = function (s) {
    s = Math.max(0, Math.min(total, s));
    vb.currentTime = Math.min(s, it.total_before - .01); va.currentTime = Math.min(s, it.total_after - .01);
    head.style.left = (s / total * 100) + '%'; t.textContent = s.toFixed(2) + ' s';
    tl.setAttribute('aria-valuenow', s.toFixed(2));
  };
  var at = function (e) { var r = tl.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * total); };
  tl.addEventListener('pointerdown', function (e) { tl.setPointerCapture(e.pointerId); at(e); });
  tl.addEventListener('pointermove', function (e) { if (e.buttons) at(e); });
  tl.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { seek(va.currentTime + 1 / 30); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { seek(va.currentTime - 1 / 30); e.preventDefault(); }
  });
  va.addEventListener('timeupdate', function () { head.style.left = (va.currentTime / total * 100) + '%'; t.textContent = va.currentTime.toFixed(2) + ' s'; });
  play.onclick = function () {
    if (va.paused) { seek(0); vb.play(); va.play(); play.textContent = 'Pause'; }
    else { vb.pause(); va.pause(); play.textContent = 'Play both'; }
  };
  va.addEventListener('ended', function () { play.textContent = 'Play both'; });
  wrap.appendChild(stage);
  wrap.appendChild(tl);
  wrap.appendChild(el('div', { class: 'clock' }, [play, t].concat(jumps)));
  wrap.appendChild(el('div', { class: 'legend' }, [
    el('span', {}, [el('span', { class: 'sw', style: 'background:var(--rule)' }), document.createTextNode('Same picture')]),
    el('span', {}, [el('span', { class: 'sw', style: 'background:var(--changed)' }), document.createTextNode('Differs')]),
    it.max_shift ? el('span', { text: 'Later by up to ' + it.max_shift.toFixed(2) + ' s' }) : null,
  ]));
  return wrap;
}

function whatLine(it) {
  if (it.change === 'new') return 'Not in the base. Check it looks right.';
  if (it.change === 'gone') return 'In the base, missing now.';
  if (it.change === 'same') return 'Looks the same.';
  if (it.change === 'timing') return 'Same pictures, different timing.';
  if (it.kind === 'film') return 'Differs from ' + it.moments.map(function (m) { return m.after[0].toFixed(2) + ' s'; }).join(', ') + '.';
  return 'The outlined area changed.';
}

function card(it) {
  var p = parts(it.name);
  var dec = store.s.decided[it.name];
  var flaky = !!store.s.flaky[it.name];
  var a = el('article', { id: 'card-' + it.name, tabindex: '-1', class: (dec === 'ok' ? 'decided-ok' : dec === 'no' ? 'decided-no' : '') + (flaky ? ' flaky' : '') });
  if (p.viewport === 'phone') a.classList.add('phone');
  a.appendChild(el('div', { class: 'head' }, [
    el('h3', { text: p.screen }),
    el('span', { class: 'tags' }, [p.viewport && el('span', { class: 'tag', text: p.viewport }), p.theme && el('span', { class: 'tag', text: p.theme }), el('span', { class: 'tag', text: it.kind })]),
    el('span', { class: 'word ' + it.change, text: STATUS[it.change] }),
    flaky ? el('span', { class: 'word flaky', text: 'Flaky, ignored' }) : null,
  ]));
  a.appendChild(el('p', { class: 'what', text: whatLine(it) }));
  var body = el('div');
  var draw = function () {
    body.textContent = '';
    if (it.kind === 'film' && it.before && it.after) { body.appendChild(filmStage(it)); return; }
    var mode = state.modes[it.name] || 0;
    if (it.before && it.after) {
      var m = el('div', { class: 'modes seg' });
      MODES.forEach(function (label, k) {
        var b = el('button', { text: label, 'aria-pressed': String(k === mode) });
        b.onclick = function () { state.modes[it.name] = k; draw(); };
        m.appendChild(b);
      });
      body.appendChild(m);
    }
    body.appendChild(stillStage(it, mode));
  };
  a.redraw = draw;
  draw();
  a.appendChild(body);
  if (it.change !== 'same') {
    var yes = el('button', { class: 'yes', text: 'Looks right', 'aria-pressed': String(dec === 'ok') });
    var no = el('button', { class: 'no', text: 'Not right', 'aria-pressed': String(dec === 'no') });
    var flake = el('button', { class: 'flake', text: flaky ? 'Count it again' : 'Flaky: ignore', 'aria-pressed': String(flaky) });
    var row = el('div', { class: 'decide' }, [yes, no, flake]);
    yes.onclick = function () { decide(it, 'ok'); };
    no.onclick = function () { decide(it, 'no'); };
    flake.onclick = function () { store.s.flaky[it.name] = !flaky; store.save(); renderAll(); };
    if (dec === 'no') {
      var ta = el('textarea', { rows: 2, placeholder: 'What is wrong? (goes to your agent)' });
      ta.value = store.s.notes[it.name] || '';
      ta.oninput = function () { store.s.notes[it.name] = ta.value; store.save(); renderDock(); };
      row.appendChild(el('label', { class: 'note' }, [ta]));
    }
    a.appendChild(row);
  }
  return a;
}

function decide(it, v) {
  store.s.decided[it.name] = store.s.decided[it.name] === v ? undefined : v;
  store.save(); renderAll();
  if (v === 'ok') step(1, it.name);
}

function renderList() {
  var list = document.getElementById('list'); list.textContent = '';
  var items = DATA.items.filter(function (i) { return !state.filter || i.change === state.filter; });
  var groups = {};
  var order = [];
  items.forEach(function (i) {
    var g = state.group === 'change' ? STATUS[i.change] : parts(i.name)[state.group] || 'other';
    if (!groups[g]) { groups[g] = []; order.push(g); }
    groups[g].push(i);
  });
  order.forEach(function (g) {
    var n = groups[g].filter(needsLook).length;
    list.appendChild(el('h2', { class: 'group' }, [el('b', { text: g }), document.createTextNode('  ' + n + ' to look at')]));
    groups[g].forEach(function (i) { list.appendChild(card(i)); });
  });
}

// ----- approve -------------------------------------------------------------------
function quote(s) { return '"' + s.replace(/(["\\$`])/g, '\\$1') + '"'; }
function renderDock() {
  var need = DATA.items.filter(needsLook);
  var seen = need.filter(function (i) { return store.s.decided[i.name]; });
  var wrong = need.filter(function (i) { return store.s.decided[i.name] === 'no'; });
  var dock = document.getElementById('dock');
  var said = document.getElementById('said').value.trim() || 'looks good';
  var flaky = DATA.items.filter(function (i) { return store.s.flaky[i.name]; }).length;
  document.getElementById('progress').innerHTML = '';
  document.getElementById('progress').appendChild(document.createTextNode(seen.length + ' of ' + need.length + ' looked at'));
  document.getElementById('progress').appendChild(el('small', { text: wrong.length ? wrong.length + ' not right' : (flaky ? flaky + ' flaky, ignored' : 'Approval covers the whole check') }));
  var copy = document.getElementById('copy'), copy2 = document.getElementById('copy2'), cmd = document.getElementById('cmd');
  dock.classList.toggle('blocked', wrong.length > 0);
  if (wrong.length) {
    var text = 'These pictures of ' + DATA.check + ' are not right:\n' + wrong.map(function (i) {
      return '- ' + i.name + (store.s.notes[i.name] ? ': ' + store.s.notes[i.name] : '');
    }).join('\n');
    copy.textContent = 'Copy feedback for agent'; copy.dataset.copy = text;
    copy2.hidden = true;
    cmd.textContent = text.replace(/\n/g, '  ');
  } else {
    var c = 'fearlezz say approve ' + DATA.check + ' --said ' + quote(said);
    copy.textContent = 'Copy approve command'; copy.dataset.copy = c;
    copy2.hidden = false; copy2.textContent = 'Copy as message'; copy2.dataset.copy = 'The ' + DATA.check + ' look is right. I said: ' + quote(said);
    cmd.textContent = c;
  }
}
['copy', 'copy2'].forEach(function (id) {
  var b = document.getElementById(id);
  b.onclick = function () {
    var label = b.textContent;
    var done = function () { b.textContent = 'Copied'; setTimeout(function () { renderDock(); }, 1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.copy).then(done, done); else done();
  };
});
document.getElementById('said').addEventListener('input', renderDock);

// ----- keys ----------------------------------------------------------------------
var current = null;
function step(d, from) {
  var cards = Array.prototype.slice.call(document.querySelectorAll('article'));
  var at = cards.findIndex(function (c) { return c.id === 'card-' + (from || current); });
  var next = cards[Math.max(0, Math.min(cards.length - 1, at + d))];
  if (!next) return;
  current = next.id.slice(5); next.focus({ preventScroll: true });
  next.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}
document.addEventListener('focusin', function (e) { var a = e.target.closest && e.target.closest('article'); if (a) current = a.id.slice(5); });
document.addEventListener('keydown', function (e) {
  if (/INPUT|TEXTAREA/.test(e.target.tagName) || e.metaKey || e.ctrlKey) return;
  var it = DATA.items.find(function (i) { return i.name === current; });
  if (e.key === 'j') step(1); else if (e.key === 'k') step(-1);
  else if (it && (e.key === 'y' || e.key === 'n')) decide(it, e.key === 'y' ? 'ok' : 'no');
  else if (it && /^[1-5]$/.test(e.key)) { state.modes[it.name] = +e.key - 1; renderAll(); document.getElementById('card-' + it.name).focus(); }
});

function renderAll() { renderCounts(); renderBar(); renderHint(); renderList(); renderDock(); }
renderAll();
</script>
</body>
</html>
