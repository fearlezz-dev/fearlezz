# Sketch of a built in piece, not loaded by Fearlezz. Spike, throwaway.
#
# Stills of a Flutter app, rendered headlessly by widget tests tagged `look`. No window, no
# simulator, no Screen Recording permission, so it runs the same on a laptop and on a Linux
# or macOS CI runner. The helper in flutter/still.dart loads real fonts and writes each still
# into $FEARLEZZ_OUT with a proof.jsonl line.
#
# Text renders slightly differently per OS, so a still is only compared with the base commit
# on the same machine. That is already how a look works.

use = ["flutter"]

# The tests without stills, so the plain test check never records pictures.
[check.flutter-test]
run = "flutter test --exclude-tags look"

[check.flutter-look]
run = "flutter test --tags look"
stage = "look"
inputs = ["lib/**", "test/**", "assets/**", "fonts/**", "pubspec.yaml", "pubspec.lock", "dart_test.yaml"]

# Declares the tag so flutter test does not warn about it. A settings target for
# dart_test.yaml does not exist yet; settings.rs would need one.
[settings.dart-test]
tags = { look = {} }
