# Sketch of a built in piece, not loaded by Fearlezz. Spike, throwaway.
#
# Stills and films of a real macOS app window, recorded with ScreenCaptureKit by
# tools/macos-recorder (here assumed on PATH as `look-record`; in a real piece it would be
# part of the fearlezz binary). The project writes the script that builds the app, starts it,
# drives it and calls the recorder; see macos-look.sh.
#
# Needs Screen Recording permission for the app that started the agent (the terminal or the
# agent's desktop app). Without it the check cannot record, so it fails with what to do once.

[check.macos-look]
run = "sh scripts/look.sh"
stage = "look"
inputs = ["Sources/**", "*.xcodeproj/**", "Package.swift", "Package.resolved", "scripts/look.sh"]
