name: release

# Merging the release pull request tags and publishes the release. A tag made with the
# workflow token starts no other workflow, so the binaries are built and uploaded here.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild the binaries for (for example v0.2.0)
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The package lives at crates/fearlezz, so the action names its outputs by that path;
    # the unprefixed release_created and tag_name are only set for a package at the root.
    outputs:
      release_created: ${{ steps.release.outputs['crates/fearlezz--release_created'] }}
      tag_name: ${{ steps.release.outputs['crates/fearlezz--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A pull request opened with the workflow token starts no workflow, so main's required
      # proof check would never run on it. A dispatched run is allowed and reports on its head.
      - name: Prove the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --label "autorelease: pending" --state open --json headRefName --jq '.[0].headRefName // empty')
          if [ -n "$branch" ]; then
            gh workflow run proof.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          fi

  build:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      - run: rustup target add ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -qy musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="fearlezz-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/fearlezz" LICENSE-MIT LICENSE-APACHE README.md "$name"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: fearlezz-*.tar.gz*

  publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach the binaries to the release
        run: gh release upload "$TAG" fearlezz-*.tar.gz* --clobber --repo "$GITHUB_REPOSITORY"
      # The action `fearlezz-dev/fearlezz@v0` follows the newest 0.x release.
      - name: Move the major version tag
        run: |
          major="${TAG%%.*}"
          git tag -f "$major"
          git push -f origin "refs/tags/$major"
