name: proof

on:
  # In CI the title decides whether a change is a fix, so an edit proves it again. A job skipped
  # by a condition would count as passed, so no edit is skipped.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # The release workflow starts it on the release pull request, which the workflow token opens.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write
  # Lets the run prove itself to the proof host and send it the proof page.
  id-token: write

jobs:
  # Fearlezz proves itself through its own action, built from this commit, so the action and
  # `fearlezz run --ci` on GitHub Actions run on every pull request. Only this job reports to
  # the pull request.
  proof:
    runs-on: ubuntu-latest
    concurrency:
      group: proof-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - name: Build Fearlezz from this commit
        run: |
          devenv shell -- cargo build --quiet
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - uses: ./
        with:
          version: installed

  # The code for macOS (recording, copy on write clones) is built, linted and tested here. It
  # proves the commit without a token, so it writes nothing to the pull request.
  proof-macos:
    runs-on: macos-latest
    concurrency:
      group: proof-macos-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - name: Build Fearlezz from this commit
        run: |
          devenv shell -- cargo build --quiet
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - uses: ./
        with:
          version: installed
          token: ""
