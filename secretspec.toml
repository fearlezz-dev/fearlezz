# Secrets of the proof host (ee/host), kept in 1Password and pushed into the Worker by the
# devenv task push-secrets. The tests need none: they pass every setting to wrangler dev.
[project]
name = "fearlezz"
revision = "1.0"

[profiles.production]
GITHUB_CLIENT_SECRET = { description = "The Fearlezz GitHub App's OAuth client secret, for signing people in", required = true }
GITHUB_APP_KEY = { description = "The Fearlezz GitHub App's private key (PEM), for its installation tokens", required = true }
SIGNING_KEY = { description = "Seals the sign in cookie and the files origin's grants (openssl rand -base64 48)", required = true }
