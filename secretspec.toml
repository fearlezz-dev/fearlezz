# Secrets kept in 1Password. The proof host's (ee/host) are pushed into the Worker by the devenv
# task push-secrets; the tests need none, they pass every setting to wrangler dev. CI reads the
# cache profile from the Fearlezz CI vault through a service account.
[project]
name = "fearlezz"
revision = "1.0"

[profiles.production]
GITHUB_CLIENT_SECRET = { description = "The Fearlezz GitHub App's OAuth client secret, for signing people in", required = true }
GITHUB_APP_KEY = { description = "The Fearlezz GitHub App's private key (PEM), for its installation tokens", required = true }
SIGNING_KEY = { description = "Seals the sign in cookie and the files origin's grants (openssl rand -base64 48)", required = true }
WEBHOOK_SECRET = { description = "The Fearlezz GitHub App's webhook secret, for checking the signature of each webhook (openssl rand -hex 32)", required = true }

[profiles.cache]
CACHIX_AUTH_TOKEN = { description = "Pushes the devenv shell CI builds to gabber235.cachix.org, so the next job pulls it", required = true }
